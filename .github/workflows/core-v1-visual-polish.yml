name: Core V1 Visual Polish

on:
  push:
    branches:
      - web-course-importer-surface-semantics-v2
    paths:
      - '.github/workflows/core-v1-visual-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: web-course-importer-surface-semantics-v2
          fetch-depth: 0

      - name: Tone down cart paths and verify environmental styles
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('src/pages/LiveCaddiePage.css')
          css = css_path.read_text()

          required = [
              '.live-context.context-woods',
              '.live-context.context-scrub',
              '.live-context.context-native-grass',
              '.live-context.context-dune-sand',
              '.live-map-feature.map-cartpath',
          ]
          missing = [selector for selector in required if selector not in css]
          if missing:
              raise SystemExit(f'Missing required Core V1 visual selectors: {missing}')

          marker = '/* Core V1 basemap polish: cart paths are quiet background context. */'
          block = '''\n\n/* Core V1 basemap polish: cart paths are quiet background context. */\n.live-map-feature.map-cartpath {\n  fill: none;\n  stroke: rgba(116, 124, 94, 0.34);\n  stroke-width: 0.44;\n  stroke-linecap: round;\n  stroke-linejoin: round;\n}\n'''
          if marker not in css:
              css_path.write_text(css + block)

          print('Core V1 visual selectors verified:')
          for selector in required:
              print(f'  {selector}')
          print('Cart paths: muted olive-gray rgba(116,124,94,0.34), width 0.44')
          PY

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Validate Core V1 runtime
        run: |
          npm run build
          npm run courses:audit-runtime -- --strict --candidate arcadia-bluffs

      - name: Commit Core V1 visual polish
        run: |
          git add src/pages/LiveCaddiePage.css
          if git diff --cached --quiet; then
            echo 'No visual changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(course): tone down OSM cart paths for core v1'
          git push origin HEAD:web-course-importer-surface-semantics-v2
