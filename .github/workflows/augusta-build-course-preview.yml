name: Augusta Build-Course Preview

on:
  push:
    branches:
      - web-course-importer-surface-semantics-v1
    paths:
      - .github/workflows/augusta-build-course-preview.yml

permissions:
  contents: write

concurrency:
  group: augusta-build-course-preview
  cancel-in-progress: false

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install course-build dependencies
        run: python -m pip install --upgrade shapely numpy rasterio pyproj

      - name: Verify build-course orchestration contract
        run: PYTHONPATH=tools python tools/test_build_course_pipeline.py

      - name: Build Augusta 1-18 candidate through canonical pipeline
        run: |
          python tools/build_course.py \
            --config config/course-geometry/augusta-national-v1.json \
            --terrain-mode required \
            --terrain-holes 1-18

      - name: Require full geometry and terrain before preview promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/course-build/augusta-national/candidate')
          summary = json.loads((root / 'build-summary.json').read_text())
          assert summary['status'] in {'PASS', 'REVIEW'}, summary
          assert summary['geometry']['readyHoles'] == 18, summary['geometry']
          assert summary['geometry']['allHolesReady'] is True, summary['geometry']
          assert summary['terrain']['requestedHoles'] == list(range(1, 19)), summary['terrain']
          assert summary['terrain']['readyHoles'] == list(range(1, 19)), summary['terrain']
          assert summary['terrain']['allRequestedReady'] is True, summary['terrain']
          assert summary['failures'] == [], summary['failures']
          print(json.dumps({
              'status': summary['status'],
              'reviewReasons': summary['reviewReasons'],
              'geometry': summary['geometry'],
              'terrainReady': len(summary['terrain']['readyHoles']),
              'courseIdentity': summary['courseIdentity'],
          }, indent=2, sort_keys=True))
          PY

      - name: Promote candidate to preview branch runtime package only
        run: |
          CANDIDATE=artifacts/course-build/augusta-national/candidate
          cp "$CANDIDATE/course-v1.json" public/course-geometry/augusta-national/course-v1.json
          cp "$CANDIDATE/build-summary.json" artifacts/course-geometry/augusta-national/build-course-summary-v1.json
          cp "$CANDIDATE/geometry-validation-v1.json" artifacts/course-geometry/augusta-national/build-course-geometry-validation-v1.json
          cp "$CANDIDATE/terrain-validation-v1.json" artifacts/course-geometry/augusta-national/build-course-terrain-validation-v1.json

      - name: Re-run Augusta runtime guard
        run: node tools/test-augusta-championship-package.mjs

      - name: Commit preview candidate and validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/course-geometry/augusta-national/course-v1.json \
            artifacts/course-geometry/augusta-national/build-course-summary-v1.json \
            artifacts/course-geometry/augusta-national/build-course-geometry-validation-v1.json \
            artifacts/course-geometry/augusta-national/build-course-terrain-validation-v1.json
          if git diff --cached --quiet; then
            echo "Candidate matches current preview package; nothing to commit."
          else
            git commit -m "preview(course): Augusta full build-course candidate"
            git push origin HEAD:web-course-importer-surface-semantics-v1
          fi
