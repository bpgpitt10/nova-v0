name: Audit high-resolution green detail

on:
  push:
    branches:
      - exact-pin-outputlog-v1
    paths:
      - 'tools/audit_green_detail.py'
      - 'tools/audit_green_local_planes.py'
      - 'public/course-geometry/greywolf/green-detail-v1.json'
      - 'public/course-geometry/greywolf/local-geometry/**'
      - '.github/workflows/green-detail-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exact-pin-outputlog-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Raw terrain discontinuity diagnostic across all 18
        run: |
          echo 'NOTE: WARN in this raw-derivative scan is diagnostic, not a tactical slope rejection. Greywolf contains legitimately steep coherent banks.'
          python tools/audit_green_detail.py \
            --course-slug greywolf \
            --report /tmp/greywolf-green-detail-audit.json
          echo 'Machine-readable report written to /tmp/greywolf-green-detail-audit.json; use the local-plane audit below for tactical slope trust.'
      - name: Tactical green-clipped local-plane audit across all 18
        run: python tools/audit_green_local_planes.py
      - name: Report coarse 3x3 sector slopes for context only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(Path('public/course-geometry/greywolf/green-detail-v1.json').read_text())
          print('NOTE: sectors are descriptive context; tactical slope now comes from green-clipped local plane fits.')
          print('hole  greenPlane  maxSector  medianSector  steepestSector')
          for number in range(1, 19):
              hole = package['holes'][str(number)]
              rows = [
                  (str(s.get('id')), float(s['planeSlopePercent']))
                  for s in hole.get('sectors', [])
                  if isinstance(s.get('planeSlopePercent'), (int, float))
              ]
              ordered = sorted(value for _, value in rows)
              median = ordered[len(ordered)//2] if ordered else 0
              steep = max(rows, key=lambda item: item[1]) if rows else ('none', 0)
              print(
                  f"H{number:02d}   {float(hole['greenSummary']['planeSlopePercent']):6.1f}%"
                  f"     {steep[1]:6.1f}%       {median:6.1f}%   {steep[0]}"
              )
          PY
