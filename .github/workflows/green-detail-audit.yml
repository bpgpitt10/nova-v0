name: Audit high-resolution green detail

on:
  push:
    branches:
      - exact-pin-outputlog-v1
    paths:
      - 'tools/audit_green_detail.py'
      - 'public/course-geometry/greywolf/green-detail-v1.json'
      - 'public/course-geometry/greywolf/local-geometry/**'
      - '.github/workflows/green-detail-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exact-pin-outputlog-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit all 18 Greywolf greens
        run: |
          python tools/audit_green_detail.py \
            --course-slug greywolf \
            --report /tmp/greywolf-green-detail-audit.json
          echo 'Machine-readable report written to /tmp/greywolf-green-detail-audit.json; console table above is the CI record.'
