name: Regenerate course geometry once

on:
  push:
    branches:
      - course-geometry-package-v1
    paths:
      - tools/course_geometry/compile_course_geometry.py
      - config/course-geometry/greywolf-v1.json
      - .github/workflows/course-geometry-regenerate-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-geometry-package-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/course_geometry/compile_course_geometry.py
      - name: Commit generated package
        run: |
          if git diff --quiet -- public/course-geometry/greywolf-v1.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/course-geometry/greywolf-v1.json
          git commit -m "Regenerate Greywolf geometry package"
          git push origin HEAD:course-geometry-package-v1
