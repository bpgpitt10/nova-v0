name: Arcadia Context Selector Fix

on:
  push:
    branches:
      - course-importer-surface-semantics-v1
    paths:
      - '.github/workflows/arcadia-context-selector-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical importer branch
        uses: actions/checkout@v4
        with:
          ref: course-importer-surface-semantics-v1
          fetch-depth: 0

      - name: Add derived course-ground fallback
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Preserve the exact golf=course boundary as an internal compiler
          # context feature. It is not emitted directly to runtime.
          replace_once(
              'tools/build_osm_course_package.py',
              '''def classify_element(tags: dict[str, Any]) -> tuple[str, str] | None:\n    golf = tags.get("golf")\n    if golf in SURFACE_GOLF:''',
              '''def classify_element(tags: dict[str, Any]) -> tuple[str, str] | None:\n    golf = tags.get("golf")\n    if golf == "course":\n        return "context", "course-boundary"\n    if golf in SURFACE_GOLF:''',
          )

          # Ensure the exact configured boundary survives even if the /map bbox
          # response happens not to repeat the whole source way.
          replace_once(
              'tools/fetch_osm_course_snapshot_core.py',
              '''    payload = fetcher.filter_to_boundary(raw_payload, boundary)\n    holes = fetcher.validate_holes(payload)''',
              '''    payload = fetcher.filter_to_boundary(raw_payload, boundary)\n    source_key = (str(source_element.get("type")), int(source_element.get("id")))\n    existing_keys = {\n        (str(element.get("type")), int(element.get("id")))\n        for element in payload.get("elements", [])\n        if isinstance(element.get("id"), int)\n    }\n    if source_key not in existing_keys:\n        payload.setdefault("elements", []).append(source_element)\n    holes = fetcher.validate_holes(payload)''',
          )

          # Runtime-visible context kinds. native-ground is explicitly derived
          # and therefore remains context-only; V7 does not promote it to deep rough.
          replace_once(
              'tools/build_osm_course_package_v4.py',
              'CONTEXT_KINDS = ("woods", "scrub", "grass-context", "native-grass", "dune-sand")',
              'CONTEXT_KINDS = ("woods", "scrub", "grass-context", "native-grass", "dune-sand", "native-ground")',
          )

          # When a course opts in, use the exact course boundary as a low-confidence
          # background context clipped to the current hole corridor. Explicit golf
          # surfaces render above it, so this fills unlabeled course interior without
          # inventing tactical lies.
          replace_once(
              'tools/build_osm_course_package_v5.py',
              '''    context = {kind: polygons for kind, polygons in context.items() if polygons}\n\n    requires_fairway = par != 3''',
              '''    context = {kind: polygons for kind, polygons in context.items() if polygons}\n\n    fallback_kind = str(selection.get("courseGroundFallbackContextKind") or "").strip()\n    if fallback_kind:\n        if fallback_kind not in v4.CONTEXT_KINDS:\n            raise ValueError(f"Unsupported courseGroundFallbackContextKind={fallback_kind}")\n        fallback_polygons = feature_intersections_rebased(\n            by_kind.get("course-boundary", []), context_corridor,\n            route_origin, forward, right, anchor_offset, simplify_yards,\n        )\n        if fallback_polygons:\n            context[fallback_kind] = [*fallback_polygons, *context.get(fallback_kind, [])]\n\n    requires_fairway = par != 3''',
          )

          # Arcadia is an explicit reviewed opt-in: the unmapped interior is shown
          # as links-style native ground, but it is not promoted to tactical deep rough.
          config_path = Path('config/course-geometry/arcadia-bluffs-v1.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          config.setdefault('selection', {})['courseGroundFallbackContextKind'] = 'native-ground'
          config_path.write_text(json.dumps(config, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          replace_once(
              'src/courseGeometry/types.ts',
              "export type CourseContextKind = 'woods' | 'scrub' | 'grass-context' | 'native-grass' | 'dune-sand'",
              "export type CourseContextKind = 'woods' | 'scrub' | 'grass-context' | 'native-grass' | 'dune-sand' | 'native-ground'",
          )
          replace_once(
              'src/courseGeometry/routePackagedCourseLoader.ts',
              "const CONTEXT_KINDS: readonly CourseContextKind[] = ['woods', 'scrub', 'grass-context', 'native-grass', 'dune-sand']",
              "const CONTEXT_KINDS: readonly CourseContextKind[] = ['woods', 'scrub', 'grass-context', 'native-grass', 'dune-sand', 'native-ground']",
          )

          # Make native grass, derived native ground, scrub, and dune visually distinct.
          replace_once(
              'src/pages/LiveCaddiePage.tsx',
              '''          <pattern id="liveScrubPattern" width="4.4" height="4.4" patternUnits="userSpaceOnUse">\n            <rect width="4.4" height="4.4" fill="#4d4a2d" fillOpacity="0.16" />\n            <circle cx="1" cy="1.2" r="0.58" fill="#b5a967" fillOpacity="0.16" />\n            <circle cx="3.2" cy="3" r="0.68" fill="#8c854f" fillOpacity="0.15" />\n          </pattern>''',
              '''          <pattern id="liveScrubPattern" width="4.4" height="4.4" patternUnits="userSpaceOnUse">\n            <rect width="4.4" height="4.4" fill="#4d4a2d" fillOpacity="0.16" />\n            <circle cx="1" cy="1.2" r="0.58" fill="#b5a967" fillOpacity="0.16" />\n            <circle cx="3.2" cy="3" r="0.68" fill="#8c854f" fillOpacity="0.15" />\n          </pattern>\n          <pattern id="liveNativePattern" width="4.8" height="4.8" patternUnits="userSpaceOnUse">\n            <rect width="4.8" height="4.8" fill="#595437" fillOpacity="0.2" />\n            <path d="M1 4.8 L1.35 2.15 M2.6 4.8 L2.35 2.75 M4 4.8 L4.25 2.35" stroke="#c4b66f" strokeOpacity="0.24" strokeWidth="0.28" />\n          </pattern>\n          <pattern id="liveDunePattern" width="5.2" height="5.2" patternUnits="userSpaceOnUse">\n            <rect width="5.2" height="5.2" fill="#8b7650" fillOpacity="0.2" />\n            <path d="M0 1.5 C1.3 1 2.6 2 5.2 1.35 M0 3.8 C1.7 3.25 3.1 4.2 5.2 3.55" fill="none" stroke="#d9c18b" strokeOpacity="0.22" strokeWidth="0.24" />\n          </pattern>''',
          )

          replace_once(
              'src/pages/LiveCaddiePage.css',
              '''.live-context.context-native-grass {\n  fill: rgba(153, 139, 70, 0.30);\n  stroke: rgba(205, 190, 105, 0.42);\n  stroke-width: 0.11;\n  stroke-dasharray: 0.34 0.22;\n}\n\n.live-context.context-dune-sand {\n  fill: rgba(181, 153, 99, 0.34);\n  stroke: rgba(224, 197, 137, 0.44);\n  stroke-width: 0.11;\n}''',
              '''.live-context.context-native-grass {\n  fill: url(#liveNativePattern);\n  stroke: rgba(205, 190, 105, 0.48);\n  stroke-width: 0.11;\n}\n\n.live-context.context-native-ground {\n  fill: url(#liveNativePattern);\n  stroke: rgba(178, 164, 91, 0.25);\n  stroke-width: 0.08;\n  opacity: 0.68;\n}\n\n.live-context.context-dune-sand {\n  fill: url(#liveDunePattern);\n  stroke: rgba(224, 197, 137, 0.44);\n  stroke-width: 0.11;\n}''',
          )
          PY

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geometry dependencies
        run: pip install -r requirements-course-geometry.txt

      - name: Preserve current Arcadia terrain
        run: |
          mkdir -p /tmp/arcadia-context
          cp public/course-geometry/arcadia-bluffs/course-v1.json /tmp/arcadia-context/old-package.json

      - name: Refresh exact Arcadia OSM snapshot
        run: |
          python tools/fetch_osm_course_snapshot_core.py \
            --config config/course-geometry/arcadia-bluffs-v1.json \
            --output artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json

      - name: Rebuild Arcadia with native course ground
        run: |
          python tools/build_osm_course_package_canonical.py \
            --osm artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json \
            --config config/course-geometry/arcadia-bluffs-v1.json \
            --output /tmp/arcadia-context/geometry.json \
            --manifest artifacts/course-geometry/arcadia-bluffs/validation-v1.json
          python tools/carry_forward_embedded_terrain.py \
            --old-package /tmp/arcadia-context/old-package.json \
            --new-package /tmp/arcadia-context/geometry.json \
            --output public/course-geometry/arcadia-bluffs/course-v1.json
          python tools/update_course_cache_after_rebuild.py \
            --cache artifacts/course-geometry/arcadia-bluffs/cache-v1.json \
            --config config/course-geometry/arcadia-bluffs-v1.json \
            --snapshot artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json \
            --package public/course-geometry/arcadia-bluffs/course-v1.json \
            --manifest artifacts/course-geometry/arcadia-bluffs/validation-v1.json

      - name: Audit Hole 9 context
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(Path('public/course-geometry/arcadia-bluffs/course-v1.json').read_text())
          hole = package['holes']['9']
          context = hole.get('context') or {}
          result = {
              'contextPolygons': {k: len(v) for k, v in sorted(context.items()) if isinstance(v, list)},
              'surfacePolygons': {k: len(v) for k, v in sorted((hole.get('surfaces') or {}).items()) if isinstance(v, list)},
          }
          Path('artifacts/course-geometry/arcadia-bluffs/hole-09-context-audit-v1.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          if len(context.get('native-ground') or []) == 0:
              raise SystemExit('Hole 9 still has no derived native-ground context')
          PY

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate runtime
        run: |
          npm ci
          npm run build
          npm run courses:audit-runtime -- --strict --candidate arcadia-bluffs

      - name: Commit derived context and rebuilt Arcadia
        run: |
          git add \
            tools/build_osm_course_package.py \
            tools/fetch_osm_course_snapshot_core.py \
            tools/build_osm_course_package_v4.py \
            tools/build_osm_course_package_v5.py \
            config/course-geometry/arcadia-bluffs-v1.json \
            src/courseGeometry/types.ts \
            src/courseGeometry/routePackagedCourseLoader.ts \
            src/pages/LiveCaddiePage.tsx \
            src/pages/LiveCaddiePage.css \
            artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json \
            artifacts/course-geometry/arcadia-bluffs/validation-v1.json \
            artifacts/course-geometry/arcadia-bluffs/cache-v1.json \
            artifacts/course-geometry/arcadia-bluffs/hole-09-context-audit-v1.json \
            public/course-geometry/arcadia-bluffs/course-v1.json \
            src/courseGeometry/generatedRouteHoleHeadings.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(course): derive native ground for unmapped Arcadia interior'
          git push origin HEAD:course-importer-surface-semantics-v1
