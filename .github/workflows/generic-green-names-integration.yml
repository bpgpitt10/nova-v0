name: Integrate course-generic green terrain names

on:
  push:
    branches:
      - exact-pin-outputlog-v1
    paths:
      - 'tools/patch_generic_green_names_v1.py'
      - '.github/workflows/generic-green-names-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exact-pin-outputlog-v1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: python tools/patch_generic_green_names_v1.py
      - run: npm ci
      - run: npm run build
      - name: Persist integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/liveCaddie/greenTargeting.ts src/liveCaddie/aimOptimization.ts src/pages/LiveCaddieWorker.ts src/pages/LiveCaddiePage.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Generic green terrain names already applied"
          else
            git commit -m "Generalize green terrain runtime beyond Greywolf"
            git fetch origin exact-pin-outputlog-v1
            git rebase origin/exact-pin-outputlog-v1
            git push origin HEAD:exact-pin-outputlog-v1
          fi
