name: Rebuild Course Canonical

on:
  push:
    branches:
      - web-course-importer-current-lineage-v1
    paths:
      - 'config/course-rebuild-request.json'

concurrency:
  group: rebuild-course-canonical
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout triggering import request with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Read rebuild request
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path

          request = json.loads(Path('config/course-rebuild-request.json').read_text())
          required = ('courseSlug', 'configPath')
          missing = [key for key in required if not request.get(key)]
          if missing:
              raise SystemExit(f"Missing rebuild request fields: {', '.join(missing)}")

          print(f"COURSE_SLUG={request['courseSlug']}")
          print(f"CONFIG_PATH={request['configPath']}")
          print(f"IMPORT_REASON={request.get('reason') or 'canonical-one-shot-import'}")
          PY

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install course importer dependencies
        run: pip install -r requirements-course-geometry.txt

      - name: Install app dependencies
        run: npm ci

      - name: Run one-shot canonical course importer
        run: |
          python tools/import_course_canonical.py \
            --config "$CONFIG_PATH" \
            --slug "$COURSE_SLUG" \
            --reason "$IMPORT_REASON"

      - name: Validate app and completed runtime candidate
        run: |
          npm run build
          npm run courses:audit-runtime -- --strict --candidate "$COURSE_SLUG"
          python - <<'PY'
          import json, os
          from pathlib import Path
          slug = os.environ['COURSE_SLUG']
          path = Path(f'artifacts/course-geometry/{slug}/validation-v1.json')
          receipt_path = Path(f'artifacts/course-geometry/{slug}/runtime-ready-v1.json')
          data = json.loads(path.read_text())
          receipt = json.loads(receipt_path.read_text())
          completion = data.get('canonicalImport') or {}
          if completion.get('complete') is not True or completion.get('runtimeReady') is not True:
              raise SystemExit('Canonical import did not stamp a complete runtime-ready result')
          if receipt.get('runtimeReady') is not True:
              raise SystemExit('Canonical import did not produce a runtime-ready receipt')
          if receipt.get('packageSha256') != completion.get('packageSha256'):
              raise SystemExit('Runtime-ready receipt and canonical completion package hashes differ')
          required = ('freshOsm', 'staticGeometry', 'wholeHoleTerrain', 'landcoverContext', 'greenDetail')
          missing = [key for key in required if completion.get(key) is not True]
          if missing:
              raise SystemExit('Canonical import is partial: ' + ', '.join(missing))
          print('canonical one-shot runtime completion verified:', ', '.join(required))
          PY

      - name: Commit completed course package and runtime registration
        run: |
          git add \
            "artifacts/course-geometry/$COURSE_SLUG/osm-snapshot.json" \
            "artifacts/course-geometry/$COURSE_SLUG/validation-v1.json" \
            "artifacts/course-geometry/$COURSE_SLUG/cache-v1.json" \
            "artifacts/course-geometry/$COURSE_SLUG/runtime-ready-v1.json" \
            "public/course-geometry/$COURSE_SLUG/course-v1.json" \
            "public/course-geometry/$COURSE_SLUG/green-detail-v1.json" \
            src/courseGeometry/generatedImportedCourseRegistry.ts \
            src/courseGeometry/generatedRouteHoleHeadings.ts

          for OPTIONAL_PATH in \
            "artifacts/course-geometry/$COURSE_SLUG/dem-source-v1.json" \
            "artifacts/course-geometry/$COURSE_SLUG/terrain-compose-v1.json" \
            "artifacts/course-geometry/$COURSE_SLUG/worldcover-context-audit-v1.json"; do
            if [ -e "$OPTIONAL_PATH" ] || git ls-files --error-unmatch "$OPTIONAL_PATH" >/dev/null 2>&1; then
              git add -A "$OPTIONAL_PATH"
            fi
          done

          if git diff --cached --quiet; then
            echo 'No course import changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build(course): one-shot import ${COURSE_SLUG}"

          # A source/test commit can land while a long import is running. Replay
          # the generated course commit on the latest branch head instead of
          # reporting a false import failure because of a non-fast-forward push.
          for ATTEMPT in 1 2 3; do
            git fetch origin web-course-importer-current-lineage-v1
            if git rebase origin/web-course-importer-current-lineage-v1 && \
               git push origin HEAD:web-course-importer-current-lineage-v1; then
              exit 0
            fi
            git rebase --abort || true
            echo "Publish attempt ${ATTEMPT} raced with another branch update; retrying."
            sleep 2
          done

          echo 'Canonical import completed and validated but could not publish after 3 race-safe attempts.' >&2
          exit 1