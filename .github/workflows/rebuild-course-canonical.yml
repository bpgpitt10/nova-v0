name: Rebuild Course Canonical

on:
  push:
    branches:
      - web-course-importer-current-lineage-v1
    paths:
      - 'config/course-rebuild-request.json'

concurrency:
  group: rebuild-course-canonical
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout course branch with history
        uses: actions/checkout@v4
        with:
          ref: web-course-importer-current-lineage-v1
          fetch-depth: 0

      - name: Read rebuild request and optional enrichment config
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import math
          from pathlib import Path

          request = json.loads(Path('config/course-rebuild-request.json').read_text())
          required = ('courseSlug', 'configPath')
          missing = [key for key in required if not request.get(key)]
          if missing:
              raise SystemExit(f"Missing rebuild request fields: {', '.join(missing)}")

          config = json.loads(Path(request['configPath']).read_text())
          green = config.get('greenTerrain') or {}
          landcover = config.get('landcoverContext') or {}
          terrain_ref = request.get('terrainSourceRef', '')

          landcover_url = str(landcover.get('sourceUrl') or '')
          if landcover.get('enabled') and not landcover_url:
              center = config.get('osmCenter') or []
              if len(center) < 2:
                  raise SystemExit('landcoverContext.enabled requires config.osmCenter or an explicit sourceUrl')
              lat = float(center[0])
              lon = float(center[1])
              lat0 = math.floor(lat / 3.0) * 3
              lon0 = math.floor(lon / 3.0) * 3
              tile = f"{'N' if lat0 >= 0 else 'S'}{abs(lat0):02d}{'E' if lon0 >= 0 else 'W'}{abs(lon0):03d}"
              landcover_url = (
                  'https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/'
                  f'ESA_WorldCover_10m_2021_v200_{tile}_Map.tif'
              )

          print(f"COURSE_SLUG={request['courseSlug']}")
          print(f"CONFIG_PATH={request['configPath']}")
          print(f"TERRAIN_SOURCE_REF={terrain_ref}")
          print(f"GREEN_DETAIL_SOURCE_REF={request.get('greenDetailSourceRef') or terrain_ref}")
          print(f"GREEN_DEM_URL={green.get('demUrl', '')}")
          print(f"GREEN_DATASET_NAME={green.get('datasetName', 'Configured high-resolution bare-earth DEM')}")
          print(f"GREEN_SOURCE_RESOLUTION_METERS={green.get('sourceResolutionMeters', '')}")
          print(f"GREEN_SPACING_YARDS={green.get('spacingYards', 1)}")
          print(f"GREEN_MARGIN_YARDS={green.get('marginYards', 12)}")
          print(f"LANDCOVER_SOURCE_URL={landcover_url}")
          PY

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geometry dependencies
        run: pip install -r requirements-course-geometry.txt

      - name: Fetch fresh exact-boundary OSM snapshot
        run: |
          mkdir -p "artifacts/course-geometry/$COURSE_SLUG" /tmp/looper-course-rebuild
          python tools/fetch_osm_course_snapshot_core.py \
            --config "$CONFIG_PATH" \
            --output "artifacts/course-geometry/$COURSE_SLUG/osm-snapshot.json"

      - name: Diagnose route endpoint orientation
        run: |
          python tools/diagnose_course_route_orientation.py \
            --osm "artifacts/course-geometry/$COURSE_SLUG/osm-snapshot.json"

      - name: Build canonical static geometry
        run: |
          python tools/build_osm_course_package_canonical.py \
            --osm "artifacts/course-geometry/$COURSE_SLUG/osm-snapshot.json" \
            --config "$CONFIG_PATH" \
            --output /tmp/looper-course-rebuild/geometry.json \
            --manifest "artifacts/course-geometry/$COURSE_SLUG/validation-v1.json"

      - name: Attach proven cached whole-hole terrain when requested
        run: |
          mkdir -p "public/course-geometry/$COURSE_SLUG"
          if [ -n "$TERRAIN_SOURCE_REF" ]; then
            git show "${TERRAIN_SOURCE_REF}:public/course-geometry/${COURSE_SLUG}/course-v1.json" \
              > /tmp/looper-course-rebuild/terrain-source-package.json
            python tools/carry_forward_embedded_terrain.py \
              --old-package /tmp/looper-course-rebuild/terrain-source-package.json \
              --new-package /tmp/looper-course-rebuild/geometry.json \
              --output "public/course-geometry/$COURSE_SLUG/course-v1.json"
          else
            cp /tmp/looper-course-rebuild/geometry.json \
              "public/course-geometry/$COURSE_SLUG/course-v1.json"
          fi

      - name: Fill optional unmapped context from WorldCover
        run: |
          AUDIT_PATH="artifacts/course-geometry/$COURSE_SLUG/worldcover-context-audit-v1.json"
          rm -f "$AUDIT_PATH"
          if [ -n "$LANDCOVER_SOURCE_URL" ]; then
            echo "Filling unmapped context from $LANDCOVER_SOURCE_URL"
            python tools/enrich_worldcover_context.py \
              --package "public/course-geometry/$COURSE_SLUG/course-v1.json" \
              --output "public/course-geometry/$COURSE_SLUG/course-v1.json" \
              --audit "$AUDIT_PATH" \
              --source-url "$LANDCOVER_SOURCE_URL"
          else
            echo 'No optional WorldCover context configured.'
          fi

      - name: Build, carry, and validate high-resolution green terrain
        run: |
          GREEN_PATH="public/course-geometry/$COURSE_SLUG/green-detail-v1.json"
          rm -f "$GREEN_PATH"
          if [ -n "$GREEN_DEM_URL" ]; then
            echo "Building green detail from configured DEM: $GREEN_DEM_URL"
            curl --fail --location --retry 3 "$GREEN_DEM_URL" \
              --output /tmp/looper-course-rebuild/green-source-dem.tif
            EXTRA_SOURCE_ARGS=()
            if [ -n "$GREEN_SOURCE_RESOLUTION_METERS" ]; then
              EXTRA_SOURCE_ARGS+=(--source-resolution-meters "$GREEN_SOURCE_RESOLUTION_METERS")
            fi
            python tools/build_course_green_detail.py \
              --course-package "public/course-geometry/$COURSE_SLUG/course-v1.json" \
              --dem /tmp/looper-course-rebuild/green-source-dem.tif \
              --output "$GREEN_PATH" \
              --spacing-yards "$GREEN_SPACING_YARDS" \
              --margin-yards "$GREEN_MARGIN_YARDS" \
              --dataset-name "$GREEN_DATASET_NAME" \
              --source-url "$GREEN_DEM_URL" \
              "${EXTRA_SOURCE_ARGS[@]}"
          elif [ -n "$GREEN_DETAIL_SOURCE_REF" ] && \
               git cat-file -e "${GREEN_DETAIL_SOURCE_REF}:public/course-geometry/${COURSE_SLUG}/green-detail-v1.json" 2>/dev/null; then
            echo "Carrying validated green detail from $GREEN_DETAIL_SOURCE_REF"
            git show "${GREEN_DETAIL_SOURCE_REF}:public/course-geometry/${COURSE_SLUG}/green-detail-v1.json" \
              > "$GREEN_PATH"
          else
            echo "No high-resolution green DEM or prior green-detail sidecar configured; course remains valid without green detail."
          fi

          if [ -f "$GREEN_PATH" ]; then
            python tools/validate_course_green_detail.py \
              --package "$GREEN_PATH" \
              --course-package "public/course-geometry/$COURSE_SLUG/course-v1.json"
            python tools/audit_course_green_surface_quality.py \
              --package "$GREEN_PATH" \
              --course-package "public/course-geometry/$COURSE_SLUG/course-v1.json"
          fi

      - name: Refresh cache provenance and hashes
        run: |
          GREEN_ARGS=()
          GREEN_PATH="public/course-geometry/$COURSE_SLUG/green-detail-v1.json"
          if [ -f "$GREEN_PATH" ]; then
            GREEN_ARGS+=(--green-detail "$GREEN_PATH")
          fi
          python tools/update_course_cache_after_rebuild.py \
            --cache "artifacts/course-geometry/$COURSE_SLUG/cache-v1.json" \
            --config "$CONFIG_PATH" \
            --snapshot "artifacts/course-geometry/$COURSE_SLUG/osm-snapshot.json" \
            --package "public/course-geometry/$COURSE_SLUG/course-v1.json" \
            --manifest "artifacts/course-geometry/$COURSE_SLUG/validation-v1.json" \
            "${GREEN_ARGS[@]}"

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Validate app, active runtime, and rebuild candidate
        run: |
          npm run build
          npm run courses:audit-runtime -- --strict --candidate "$COURSE_SLUG"

      - name: Commit rebuilt package and provenance
        run: |
          git add \
            "artifacts/course-geometry/$COURSE_SLUG/osm-snapshot.json" \
            "artifacts/course-geometry/$COURSE_SLUG/validation-v1.json" \
            "artifacts/course-geometry/$COURSE_SLUG/cache-v1.json" \
            "public/course-geometry/$COURSE_SLUG/course-v1.json" \
            src/courseGeometry/generatedRouteHoleHeadings.ts

          GREEN_PATH="public/course-geometry/$COURSE_SLUG/green-detail-v1.json"
          if [ -e "$GREEN_PATH" ] || git ls-files --error-unmatch "$GREEN_PATH" >/dev/null 2>&1; then
            git add -A "$GREEN_PATH"
          fi

          LANDCOVER_AUDIT="artifacts/course-geometry/$COURSE_SLUG/worldcover-context-audit-v1.json"
          if [ -e "$LANDCOVER_AUDIT" ] || git ls-files --error-unmatch "$LANDCOVER_AUDIT" >/dev/null 2>&1; then
            git add -A "$LANDCOVER_AUDIT"
          fi

          if git diff --cached --quiet; then
            echo 'No course rebuild changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build(course): rebuild ${COURSE_SLUG} with canonical importer"
          git push origin HEAD:web-course-importer-current-lineage-v1
