name: Rebuild Course Canonical

on:
  push:
    branches:
      - web-course-importer-current-lineage-v1
      - web-course-e2e-preflight-v1
    paths:
      - 'config/course-rebuild-request.json'
      - 'config/course-name-request.json'

concurrency:
  group: rebuild-course-canonical
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout triggering import request with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve name-only course request, when that file triggered this run
        run: |
          if git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -qx 'config/course-name-request.json'; then
            python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          req=json.loads(Path('config/course-name-request.json').read_text(encoding='utf-8'))
          if req.get('schemaVersion') != 'looper-course-name-request-v1':
              raise SystemExit('Invalid course-name request schema')
          subprocess.run(['python', 'tools/discover_osm_course_by_name.py', '--name', req['name'], '--requested-at', req.get('requestedAt','')],check=True)
          PY
          fi

      - name: Read rebuild request
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path

          request = json.loads(Path('config/course-rebuild-request.json').read_text())
          required = ('courseSlug', 'configPath')
          missing = [key for key in required if not request.get(key)]
          if missing:
              raise SystemExit(f"Missing rebuild request fields: {', '.join(missing)}")

          print(f"COURSE_SLUG={request['courseSlug']}")
          print(f"CONFIG_PATH={request['configPath']}")
          print(f"IMPORT_REASON={request.get('reason') or 'canonical-one-shot-import'}")
          PY

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install course importer dependencies
        run: pip install -r requirements-course-geometry.txt

      - name: Install app dependencies
        run: npm ci

      - name: Unit test name-only course discovery
        run: python tools/test_discover_osm_course_by_name.py

      - name: Unit test WorldCover tee protection
        run: python tools/test_course_landcover_masks.py

      - name: Run one-shot canonical course importer
        run: |
          EXTRA_ARGS=()
          if [ "$GITHUB_REF_NAME" = "web-course-e2e-preflight-v1" ]; then
            EXTRA_ARGS+=(--allow-map-preview)
          fi
          python tools/import_course_canonical.py \
            --config "$CONFIG_PATH" \
            --slug "$COURSE_SLUG" \
            --reason "$IMPORT_REASON" "${EXTRA_ARGS[@]}"

      - name: Publish discovery and timing into job summary even on failure
        if: always()
        run: |
          {
            echo '### Course request diagnostics'
            echo 'Course: ${COURSE_SLUG:-not-resolved}'
            echo 'Git commit: ${GITHUB_SHA}'
            for FILE in artifacts/course-discovery-v1.json artifacts/course-geometry/*/import-timing-v1.json; do
              if [ -f "$FILE" ]; then
                echo "\`\`\`json"
                cat "$FILE"
                echo "\`\`\`"
              fi
            done
            # A failed static contract still leaves its generated package in
            # the runner workspace. Preserve all hole counts in the job summary
            # even when GitHub Actions artifact storage is over quota.
            if [ -n "${COURSE_SLUG:-}" ] && [ -f "public/course-geometry/$COURSE_SLUG/course-v1.json" ]; then
              echo '#### Per-hole mapped tee coverage (unpublished candidate)'
              node -e '
                const fs=require("node:fs");
                const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                for (const [hole,h] of Object.entries(p.holes||{})) {
                  const tees=(h.surfaces?.tee||[]).length;
                  const candidates=(h.teeCandidates||[]).length;
                  const origin=h.coordinateFrame?.teeAnchorMethod||"unknown";
                  console.log("Hole "+hole+": mappedTeePolygons="+tees+
                    " teeCandidates="+candidates+" anchor="+origin);
                }
              ' "public/course-geometry/$COURSE_SLUG/course-v1.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate app and completed runtime candidate
        run: |
          npm run build
          if [ -f "artifacts/course-geometry/$COURSE_SLUG/runtime-ready-v1.json" ]; then
            npm run courses:audit-runtime -- --strict --candidate "$COURSE_SLUG"
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          slug = os.environ['COURSE_SLUG']
          path = Path(f'artifacts/course-geometry/{slug}/validation-v1.json')
          receipt_path = Path(f'artifacts/course-geometry/{slug}/runtime-ready-v1.json')
          map_path = Path(f'artifacts/course-geometry/{slug}/map-ready-v1.json')
          map_receipt = json.loads(map_path.read_text())
          if map_receipt.get('mapReady') is not True:
              raise SystemExit('Map quality gate not passed')
          if not receipt_path.exists():
              if os.environ.get('GITHUB_REF_NAME') != 'web-course-e2e-preflight-v1':
                  raise SystemExit('Map-only artifacts are prohibited outside staging')
              if map_receipt.get('runtimeReady') is not False:
                  raise SystemExit('Map-only receipt incorrectly says runtime ready')
              print('map-ready only: not registered for live use')
              raise SystemExit(0)
          data = json.loads(path.read_text())
          receipt = json.loads(receipt_path.read_text())
          completion = data.get('canonicalImport') or {}
          if completion.get('complete') is not True or completion.get('runtimeReady') is not True:
              raise SystemExit('Canonical import did not stamp a complete runtime-ready result')
          if receipt.get('runtimeReady') is not True:
              raise SystemExit('Canonical import did not produce a runtime-ready receipt')
          if receipt.get('packageSha256') != completion.get('packageSha256'):
              raise SystemExit('Runtime-ready receipt and canonical completion package hashes differ')
          required = ('freshOsm', 'staticGeometry', 'wholeHoleTerrain', 'landcoverContext', 'greenDetail')
          missing = [key for key in required if completion.get(key) is not True]
          if missing:
              raise SystemExit('Canonical import is partial: ' + ', '.join(missing))
          print('canonical one-shot runtime completion verified:', ', '.join(required))
          PY

      - name: Commit completed course package and runtime registration
        run: |
          git add \
            "config/course-geometry/$COURSE_SLUG-v1.json" \
            "artifacts/course-geometry/$COURSE_SLUG/osm-snapshot.json" \
            "artifacts/course-geometry/$COURSE_SLUG/validation-v1.json" \
            "artifacts/course-geometry/$COURSE_SLUG/cache-v1.json" \
            "artifacts/course-geometry/$COURSE_SLUG/map-ready-v1.json" \
            "public/course-review/index-v1.json" \
            "public/course-geometry/$COURSE_SLUG/course-v1.json" \
            "public/course-geometry/$COURSE_SLUG/green-detail-v1.json" \
            src/courseGeometry/generatedImportedCourseRegistry.ts \
            src/courseGeometry/generatedRouteHoleHeadings.ts

          for OPTIONAL_PATH in \
            "artifacts/course-geometry/$COURSE_SLUG/runtime-ready-v1.json" \
            "artifacts/course-geometry/$COURSE_SLUG/import-timing-v1.json" \
            artifacts/course-discovery-v1.json \
            "artifacts/course-geometry/$COURSE_SLUG/dem-source-v1.json" \
            "artifacts/course-geometry/$COURSE_SLUG/terrain-compose-v1.json" \
            "artifacts/course-geometry/$COURSE_SLUG/worldcover-context-audit-v1.json"; do
            if [ -e "$OPTIONAL_PATH" ] || git ls-files --error-unmatch "$OPTIONAL_PATH" >/dev/null 2>&1; then
              git add -A "$OPTIONAL_PATH"
            fi
          done

          if git diff --cached --quiet; then
            echo 'No course import changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build(course): one-shot import ${COURSE_SLUG}"

          # A source/test commit can land while a long import is running. Replay
          # the generated course commit on the latest branch head instead of
          # reporting a false import failure because of a non-fast-forward push.
          for ATTEMPT in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase "origin/$GITHUB_REF_NAME" && \
               git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort || true
            echo "Publish attempt ${ATTEMPT} raced with another branch update; retrying."
            sleep 2
          done

          echo 'Canonical import completed and validated but could not publish after 3 race-safe attempts.' >&2
          exit 1