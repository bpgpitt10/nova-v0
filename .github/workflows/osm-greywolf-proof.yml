name: Greywolf OSM coverage proof

on:
  push:
    branches:
      - hazard-field-lab-v0
    paths:
      - .github/workflows/osm-greywolf-proof.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  greywolf-osm-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4

      - name: Query Overpass and report golf coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import urllib.parse
          import urllib.request
          from collections import Counter, defaultdict
          from pathlib import Path

          bbox = (50.414, -116.295, 50.493, -116.194)
          south, west, north, east = bbox
          query = f'''[out:json][timeout:30];
          (
            way["golf"]({south},{west},{north},{east});
            relation["golf"]({south},{west},{north},{east});
          );
          out tags geom;'''
          endpoints = [
              'https://overpass-api.de/api/interpreter',
              'https://overpass.kumi.systems/api/interpreter',
              'https://overpass.nchc.org.tw/api/interpreter',
          ]

          payload = None
          used = None
          errors = []
          for endpoint in endpoints:
              try:
                  data = urllib.parse.urlencode({'data': query}).encode('utf-8')
                  req = urllib.request.Request(
                      endpoint,
                      data=data,
                      method='POST',
                      headers={
                          'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                          'User-Agent': 'Looper-Greywolf-OSM-Proof/0.3',
                      },
                  )
                  with urllib.request.urlopen(req, timeout=40) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                  used = endpoint
                  break
              except Exception as exc:
                  errors.append(f'{endpoint}: {exc}')

          if payload is None:
              raise SystemExit('All Overpass endpoints failed: ' + ' | '.join(errors))

          elements = payload.get('elements', [])
          counts = Counter()
          refs = defaultdict(list)
          geometry_vertices = Counter()
          closed_polygons = Counter()
          feature_index = []
          hole_metrics = []

          def geometries_for(element):
              geoms = []
              if element.get('geometry'):
                  geoms.append(element['geometry'])
              for member in element.get('members', []):
                  if member.get('geometry'):
                      geoms.append(member['geometry'])
              return geoms

          def haversine_m(a, b):
              r = 6371008.8
              lat1, lon1 = math.radians(a['lat']), math.radians(a['lon'])
              lat2, lon2 = math.radians(b['lat']), math.radians(b['lon'])
              dlat, dlon = lat2-lat1, lon2-lon1
              h = math.sin(dlat/2)**2 + math.cos(lat1)*math.cos(lat2)*math.sin(dlon/2)**2
              return 2*r*math.asin(math.sqrt(h))

          def bearing_deg(a, b):
              lat1, lat2 = math.radians(a['lat']), math.radians(b['lat'])
              dlon = math.radians(b['lon'] - a['lon'])
              y = math.sin(dlon) * math.cos(lat2)
              x = math.cos(lat1)*math.sin(lat2) - math.sin(lat1)*math.cos(lat2)*math.cos(dlon)
              return (math.degrees(math.atan2(y, x)) + 360) % 360

          for element in elements:
              tags = element.get('tags') or {}
              golf = tags.get('golf')
              if not golf:
                  continue
              counts[golf] += 1
              if tags.get('ref'):
                  refs[golf].append(tags['ref'])
              geometries = geometries_for(element)
              points = [p for geom in geometries for p in geom if p.get('lat') is not None and p.get('lon') is not None]
              for geom in geometries:
                  geometry_vertices[golf] += len(geom)
                  if len(geom) >= 4 and geom[0].get('lat') == geom[-1].get('lat') and geom[0].get('lon') == geom[-1].get('lon'):
                      closed_polygons[golf] += 1
              if points:
                  lats = [p['lat'] for p in points]
                  lons = [p['lon'] for p in points]
                  bounds = [min(lats), min(lons), max(lats), max(lons)]
                  centroid = [sum(lats) / len(lats), sum(lons) / len(lons)]
              else:
                  bounds = None
                  centroid = None
              feature_index.append({
                  'type': element.get('type'),
                  'id': element.get('id'),
                  'golf': golf,
                  'ref': tags.get('ref'),
                  'name': tags.get('name'),
                  'par': tags.get('par'),
                  'handicap': tags.get('handicap'),
                  'surface': tags.get('surface'),
                  'vertex_count': len(points),
                  'bounds': bounds,
                  'centroid': centroid,
              })
              if golf == 'hole' and tags.get('ref') and points:
                  route_m = sum(haversine_m(a,b) for a,b in zip(points, points[1:]))
                  direct_m = haversine_m(points[0], points[-1]) if len(points) > 1 else 0
                  hole_metrics.append({
                      'hole': tags.get('ref'),
                      'par': tags.get('par'),
                      'vertices': len(points),
                      'start': [points[0]['lat'], points[0]['lon']],
                      'end': [points[-1]['lat'], points[-1]['lon']],
                      'direct_yards': round(direct_m * 1.0936133, 1),
                      'route_yards': round(route_m * 1.0936133, 1),
                      'bearing_deg': round(bearing_deg(points[0], points[-1]), 1) if len(points) > 1 else None,
                  })

          hole_refs = sorted(set(refs.get('hole', [])), key=lambda x: (not str(x).isdigit(), int(x) if str(x).isdigit() else str(x)))
          hole_metrics.sort(key=lambda x: int(x['hole']) if str(x['hole']).isdigit() else 999)
          summary = {
              'source': used,
              'bbox': bbox,
              'raw_element_count': len(elements),
              'counts_by_golf_tag': dict(sorted(counts.items())),
              'hole_refs': hole_refs,
              'geometry_vertices_by_tag': dict(sorted(geometry_vertices.items())),
              'closed_geometry_parts_by_tag': dict(sorted(closed_polygons.items())),
          }

          out_dir = Path('artifacts/osm-proof')
          out_dir.mkdir(parents=True, exist_ok=True)
          Path('greywolf-osm.json').write_text(json.dumps(payload), encoding='utf-8')
          Path('greywolf-osm-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True), encoding='utf-8')
          (out_dir / 'greywolf-osm-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True), encoding='utf-8')
          (out_dir / 'greywolf-osm-feature-index.json').write_text(json.dumps(feature_index, indent=2, sort_keys=True), encoding='utf-8')
          (out_dir / 'greywolf-osm-hole-metrics.json').write_text(json.dumps(hole_metrics, indent=2, sort_keys=True), encoding='utf-8')

          print('GREYWOLF_OSM_PROOF_JSON_START')
          print(json.dumps(summary, indent=2, sort_keys=True))
          print(json.dumps(hole_metrics, indent=2, sort_keys=True))
          print('GREYWOLF_OSM_PROOF_JSON_END')

          if counts['green'] < 15 or counts['fairway'] < 15:
              raise SystemExit(f'Coverage too incomplete for OSM-first proof: greens={counts["green"]}, fairways={counts["fairway"]}')
          PY

      - name: Persist proof summary and feature index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/osm-proof/greywolf-osm-summary.json artifacts/osm-proof/greywolf-osm-feature-index.json artifacts/osm-proof/greywolf-osm-hole-metrics.json
          if git diff --cached --quiet; then
            echo "Proof outputs unchanged"
          else
            git commit -m "test(strategy): record Greywolf OSM coverage proof"
            git push
          fi

      - name: Upload OSM proof payload
        uses: actions/upload-artifact@v4
        with:
          name: greywolf-osm-proof
          path: |
            greywolf-osm.json
            greywolf-osm-summary.json
            artifacts/osm-proof/greywolf-osm-feature-index.json
            artifacts/osm-proof/greywolf-osm-hole-metrics.json
          retention-days: 7
