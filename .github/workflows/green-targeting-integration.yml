name: Integrate high-resolution green targeting

on:
  push:
    branches:
      - exact-pin-outputlog-v1
    paths:
      - .github/workflows/green-targeting-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exact-pin-outputlog-v1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Patch Live Caddie green targeting
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/LiveCaddiePage.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_one(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'Expected exactly one match, found {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          replace_one(
              "import { greywolfHole01Geometry } from '../courseGeometry/greywolfHole01'\nimport { classifyPoint, fairwayCorridorAtForwardY } from '../courseGeometry/geometry'",
              "import { greywolfHole01Geometry } from '../courseGeometry/greywolfHole01'\nimport {\n  loadGreywolfGreenDetail,\n  sampleGreywolfGreenElevation,\n  type GreywolfGreenDetail,\n} from '../courseGeometry/greywolfGreenDetail'\nimport { classifyPoint, fairwayCorridorAtForwardY } from '../courseGeometry/geometry'",
          )

          replace_one(
              "import type {\n  AimCandidateEvaluation,\n  ClubAimEvaluation,\n} from '../liveCaddie/aimOptimization'",
              "import type {\n  AimCandidateEvaluation,\n  ClubAimEvaluation,\n} from '../liveCaddie/aimOptimization'\nimport { buildGreywolfGreenApproachTarget } from '../liveCaddie/greenTargeting'",
          )

          replace_one(
              "  const [holeHeadingDegreesTrue, setHoleHeadingDegreesTrue] = useState<number | null>(null)\n  const [show95, setShow95] = useState(false)",
              "  const [holeHeadingDegreesTrue, setHoleHeadingDegreesTrue] = useState<number | null>(null)\n  const [greenDetail, setGreenDetail] = useState<GreywolfGreenDetail | null>(null)\n  const [show95, setShow95] = useState(false)",
          )

          heading_effect = """  useEffect(() => {
    let active = true
    setHoleHeadingDegreesTrue(null)
    if (courseId === UNSELECTED_COURSE_ID) return () => { active = false }
    void loadCourseHoleHeadingDegreesTrue(courseId, holeNumber).then((heading) => {
      if (active) setHoleHeadingDegreesTrue(heading)
    })
    return () => {
      active = false
    }
  }, [courseId, holeNumber])
"""
          replace_one(
              heading_effect,
              heading_effect + """
  useEffect(() => {
    let active = true
    setGreenDetail(null)
    if (courseId !== GREYWOLF_COURSE_ID) return () => { active = false }
    void loadGreywolfGreenDetail(holeNumber).then((detail) => {
      if (active) setGreenDetail(detail)
    })
    return () => {
      active = false
    }
  }, [courseId, holeNumber])
""",
          )

          replace_one(
              """  useEffect(() => {
    if (!hole || !liveSnapshot || liveSnapshot.holeNumber !== hole.holeNumber) return
    const nextBall = liveSnapshot.ballLocalYds
      ?? (liveSnapshot.ballSource === 'cached-tee' ? hole.markers.tee : null)
    if (!nextBall) return
    const nextPin = estimatePinFromGsproDistance(hole, nextBall, liveSnapshot.distanceToPinYds)
    setBall(nextBall)
    setTarget(chooseLiveLandingTarget(hole, nextBall, nextPin))
  }, [hole, liveSnapshot])
""",
              """  useEffect(() => {
    if (!hole || !liveSnapshot || liveSnapshot.holeNumber !== hole.holeNumber) return
    const nextBall = liveSnapshot.ballLocalYds
      ?? (liveSnapshot.ballSource === 'cached-tee' ? hole.markers.tee : null)
    if (!nextBall) return
    const nextPin = liveSnapshot.pinLocalYds
      ?? estimatePinFromGsproDistance(hole, nextBall, liveSnapshot.distanceToPinYds)
    const baselineTarget = chooseLiveLandingTarget(hole, nextBall, nextPin)
    const refinedGreenTarget = courseId === GREYWOLF_COURSE_ID
      && greenDetail
      && nextPin
      && liveSnapshot.pinSource === 'output-log-course-layout'
      && pointDistance(nextBall, nextPin) <= 260
      ? buildGreywolfGreenApproachTarget({
          hole,
          ball: nextBall,
          pin: nextPin,
          detail: greenDetail,
          exactPin: true,
        })
      : null
    setBall(nextBall)
    setTarget(refinedGreenTarget?.target ?? baselineTarget)
  }, [hole, liveSnapshot, courseId, greenDetail])
""",
          )

          replace_one(
              """  const liveMatchesHole = Boolean(liveSnapshot?.holeNumber === holeNumber)
  const pinEstimate = hole
    ? estimatePinFromGsproDistance(
        hole,
        ball,
        liveMatchesHole ? liveSnapshot?.distanceToPinYds ?? null : null,
      )
    : null
""",
              """  const liveMatchesHole = Boolean(liveSnapshot?.holeNumber === holeNumber)
  const pinEstimate = hole
    ? liveMatchesHole && liveSnapshot?.pinLocalYds
      ? liveSnapshot.pinLocalYds
      : estimatePinFromGsproDistance(
          hole,
          ball,
          liveMatchesHole ? liveSnapshot?.distanceToPinYds ?? null : null,
        )
    : null
""",
          )

          replace_one(
              """  const ballTerrain = hole ? estimateCourseTerrain(hole, ball) : null
  const targetTerrain = hole ? estimateCourseTerrain(hole, target) : null
""",
              """  const greenBallElevationFt = courseId === GREYWOLF_COURSE_ID && greenDetail
    ? sampleGreywolfGreenElevation(greenDetail, ball)
    : null
  const ballTerrain = greenBallElevationFt != null
    ? {
        elevationFt: greenBallElevationFt,
        source: 'lidar-dem' as const,
        confidence: 'high' as const,
        gridSpacingYds: greenDetail?.grid.spacingYds ?? 1,
        note: 'High-resolution 1 yd Greywolf green LiDAR sample.',
      }
    : hole ? estimateCourseTerrain(hole, ball) : null
  const greenTargetElevationFt = courseId === GREYWOLF_COURSE_ID && greenDetail
    ? sampleGreywolfGreenElevation(greenDetail, target)
    : null
  const targetTerrain = greenTargetElevationFt != null
    ? {
        elevationFt: greenTargetElevationFt,
        source: 'lidar-dem' as const,
        confidence: 'high' as const,
        gridSpacingYds: greenDetail?.grid.spacingYds ?? 1,
        note: 'High-resolution 1 yd Greywolf green LiDAR sample.',
      }
    : hole ? estimateCourseTerrain(hole, target) : null
""",
          )

          replace_one(
              """  const isGreenSurface = normalizedCurrentSurface === 'green'
  const isTeeSurface = typeof authoritativeGsproSurface === 'string'
""",
              """  const isGreenSurface = normalizedCurrentSurface === 'green'
  const greenGuidance = !isGreenSurface
    && courseId === GREYWOLF_COURSE_ID
    && hole
    && greenDetail
    && pinEstimate
    && liveMatchesHole
    && liveSnapshot?.pinSource === 'output-log-course-layout'
    && pointDistance(ball, pinEstimate) <= 260
    ? buildGreywolfGreenApproachTarget({
        hole,
        ball,
        pin: pinEstimate,
        detail: greenDetail,
        exactPin: true,
      })
    : null
  const isTeeSurface = typeof authoritativeGsproSurface === 'string'
""",
          )

          replace_one(
              """            <span>{shotContext}</span>
            {pinEstimate ? <span>{Math.round(pointDistance(ball, pinEstimate))} yd to pin</span> : null}
            {!isGreenSurface && elevationDeltaFt != null ? <span>{signed(elevationDeltaFt, 0)} ft to target</span> : null}
""",
              """            <span>{shotContext}</span>
            {pinEstimate ? <span>{Math.round(pointDistance(ball, pinEstimate))} yd to pin</span> : null}
            {greenGuidance ? <span>Green LiDAR · {greenGuidance.reason}</span> : null}
            {!isGreenSurface && elevationDeltaFt != null ? <span>{signed(elevationDeltaFt, 0)} ft to target</span> : null}
""",
          )

          path.write_text(text, encoding='utf-8')

      - run: npm ci
      - run: npm run build

      - name: Persist integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/LiveCaddiePage.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Live Caddie green targeting already integrated"
          else
            git commit -m "Use exact pin and 1 yd LiDAR for green targeting"
            git fetch origin exact-pin-outputlog-v1
            git rebase origin/exact-pin-outputlog-v1
            git push origin HEAD:exact-pin-outputlog-v1
          fi
