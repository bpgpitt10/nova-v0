name: Web GSPro proof

on:
  push:
    branches:
      - web-gspro-proof
  workflow_dispatch:

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  ogc-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify OpenGolfCoach calculation and input contract
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          import opengolfcoach

          shot = {
              "ball_speed_meters_per_second": 70.0,
              "vertical_launch_angle_degrees": 12.5,
              "horizontal_launch_angle_degrees": -2.0,
              "total_spin_rpm": 2800.0,
              "spin_axis_degrees": 15.0,
          }
          result = json.loads(opengolfcoach.calculate_derived_values(json.dumps(shot)))
          ogc = result.get("open_golf_coach", {})
          assert "shot_name" in ogc
          assert "shot_rank" in ogc
          assert "us_customary_units" in ogc

          module_path = Path("api/open-golf-coach/derive.py")
          spec = importlib.util.spec_from_file_location("looper_ogc_api", module_path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          assert module._missing_or_invalid_fields(shot) == []
          partial = dict(shot)
          partial.pop("spin_axis_degrees")
          assert module._missing_or_invalid_fields(partial) == ["spin_axis_degrees"]

          print(json.dumps({
              "shot_name": ogc.get("shot_name"),
              "shot_rank": ogc.get("shot_rank"),
              "carry_yards": ogc.get("us_customary_units", {}).get("carry_distance_yards"),
              "input_contract": "ok",
          }))
          PY
