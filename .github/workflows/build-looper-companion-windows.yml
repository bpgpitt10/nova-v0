name: Build Looper Windows Companion

on:
  workflow_dispatch:
  push:
    branches:
      - web-alpha-mishits
      - web-course-importer-surface-semantics-v2
      - auto-aim-windows-companion-v1
      - unified-imported-course-positioning-v1
      - companion-course-layouts-v1
      - web-native-aim-preview-v1
      - web-course-load-v1
      - web-companion-gspro-files-v1
      - web-native-rotated-courses-v1
      - web-rounds-history-v1
    paths:
      - "helpers/gspro_file_bridge.py"
      - "tests/test_companion_gspro_files.py"
      - "helpers/gspro_native_aim.py"
      - "tests/test_gspro_companion_aim_preview.py"
      - "helpers/looper_companion.py"
      - "helpers/companion-releases-README.md"
      - "helpers/gspro_course_library.py"
      - "tests/test_gspro_companion_course_layouts.py"
      - "helpers/gspro_native_discovery.py"
      - "helpers/gspro_window_capture.py"
      - "helpers/gspro_live_observations.py"
      - "helpers/gspro_native_wind_ocr.py"
      - "tests/fixtures/gspro_wind_8mph_se_band.png"
      - "tests/fixtures/gspro_lie_2down_09right_footer.png"
      - "tests/fixtures/gspro_hud_shot1_4926.png"
      - "tests/fixtures/gspro_hud_shot3_2830.png"
      - "helpers/gspro_native_hud_ocr.py"
      - "tests/test_gspro_companion_hud.py"
      - "helpers/install_looper_companion.ps1"
      - "helpers/gspro_native_lie_ocr.py"
      - "helpers/gspro_companion_minimap_calibration.py"
      - "helpers/waypoint_scale_cv.py"
      - "helpers/waypoint_scale.py"
      - "helpers/minimap_registration.py"
      - "tests/test_gspro_companion_waypoint.py"
      - "helpers/gspro_direct_click.py"
      - "helpers/gspro_aim_click.py"
      - "tests/test_gspro_companion_aim_click.py"
      - "helpers/gspro_minimap_markers.py"
      - "helpers/gspro_minimap_pipeline.py"
      - "helpers/auto_aim_transform.py"
      - "helpers/minimap_registration.py"
      - "helpers/waypoint_scale.py"
      - "helpers/waypoint_scale_cv.py"
      - "tests/test_gspro_companion_minimap.py"
      - "tests/test_gspro_companion_actuator.py"
      - "tests/test_gspro_companion_discovery.py"
      - "tests/test_gspro_companion_observations.py"
      - "tests/test_gspro_companion_wind.py"
      - "tests/test_looper_companion_stage_a.py"
      - "src/adapters/looperCompanion.ts"
      - "public/dev/companion-connect.html"
      - "public/dev/companion-observations.html"
      - "helpers/open_golf_coach_helper.py"
      - "helpers/open_golf_coach_helper_lie_footer.py"
      - "helpers/install_looper_companion.ps1"
      - "helpers/install_looper_companion.cmd"
      - "helpers/uninstall_looper_companion.ps1"
      - "helpers/looper_companion_setup.iss"
      - ".github/workflows/build-looper-companion-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller opengolfcoach numpy opencv-python-headless

      - name: Reuse physically validated portable Tesseract bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reuse OUR own pinned OCR bundle already proven on physical GSPro.
          # Avoid Chocolatey package-feed 504 failures and version drift.
          $tag = "looper-companion-autoaim-stage-c-d11eb7ad"
          $extract = Join-Path $env:RUNNER_TEMP "pinned-looper-ocr"
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          gh release download $tag --repo "$env:GITHUB_REPOSITORY" --pattern "looper-windows-companion.zip" --dir $extract
          if ($LASTEXITCODE -ne 0) { throw "Pinned OCR release download failed." }
          $zip = Join-Path $extract "looper-windows-companion.zip"
          if (!(Test-Path $zip)) { throw "Pinned OCR ZIP missing." }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $extract "unzipped")
          $ocrRoot = Join-Path $extract "unzipped/ocr"
          if (!(Test-Path (Join-Path $ocrRoot "tesseract.exe")) -or
              !(Test-Path (Join-Path $ocrRoot "tessdata/eng.traineddata"))) {
            throw "Pinned release lacks complete portable Tesseract and English data."
          }
          Copy-Item $ocrRoot -Destination portable-ocr -Recurse -Force
          & "portable-ocr/tesseract.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Pinned OCR executable cannot launch." }
          $langs = & "portable-ocr/tesseract.exe" --list-langs
          if ($LASTEXITCODE -ne 0 -or $langs -notcontains "eng") {
            throw "Pinned English traineddata unavailable."
          }

      - name: Test Stage C read-only registration, safety, discovery and handshake
        shell: pwsh
        run: |
          # The pinned portable OCR lets the real FarmLinks wind-box fixture run.
          $env:PATH = "$((Resolve-Path portable-ocr).Path);$env:PATH"
          $env:TESSDATA_PREFIX = "$((Resolve-Path portable-ocr/tessdata).Path)"
          python -m unittest discover -s tests -p "test_*companion*.py" -v

      - name: Build Looper Companion
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole `
            --name LooperCompanion `
            --paths helpers `
            helpers/looper_companion.py

      - name: Smoke test companion executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/LooperCompanion.exe" -PassThru -WindowStyle Hidden
          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 2
                break
              } catch {}
            }
            if ($null -eq $health) {
              throw "Looper Companion never exposed /health."
            }
            if ($health.service -ne "open-golf-coach-helper" -or $health.status -ne "ok") {
              throw "Unexpected companion health payload: $($health | ConvertTo-Json -Compress)"
            }
            if ($health.version -ne "6-looper-companion") {
              throw "Unexpected companion version: $($health.version)"
            }

            $headers = @{ Origin = "https://thelooper.golf" }
            $companion = Invoke-RestMethod -Uri "http://127.0.0.1:8787/companion/v1/status" -Headers $headers -TimeoutSec 3
            if ($companion.service -ne "looper-companion" -or $companion.version -ne "courses.10") {
              throw "New companion status route is not available in packaged build."
            }
            if ($companion.capabilities.folderDiscovery -ne $true -or $companion.capabilities.captureDiagnostic -ne $true) {
              throw "Stage B discover/capture diagnostic capabilities missing."
            }
            $capture = Invoke-RestMethod -Uri "http://127.0.0.1:8787/companion/v1/capture-check" -Headers $headers -TimeoutSec 3
            if ($capture.windowCapture.status -ne "not-connected") {
              throw "Capture check without GSPro must fail closed."
            }
            if ($companion.capabilities.liveObservations -ne $true) {
              throw "Unified observation diagnostic capability missing."
            }
            $observed = Invoke-RestMethod -Uri "http://127.0.0.1:8787/companion/v1/observations" -Headers $headers -TimeoutSec 12
            if ($observed.schemaVersion -ne "native-observations-v1" -or $observed.capabilities.autoAim -ne $false) {
              throw "Packaged native observation endpoint failed read-only smoke."
            }
            if ($companion.capabilities.courseLayouts -ne $true) {
              throw "Course-layout capability missing."
            }
            $layouts = Invoke-RestMethod -Uri "http://127.0.0.1:8787/companion/v1/course-layouts?courseKey=missing_course_gsp" -Headers $headers -TimeoutSec 10
            if ($layouts.schemaVersion -ne "looper-companion-course-layouts-v1" -or $layouts.status -ne "not-found") {
              throw "Course-layout endpoint must answer not-found without a course library: $($layouts | ConvertTo-Json -Compress)"
            }
            if ($companion.capabilities.aimPreview -ne $true) {
              throw "Aim preview capability missing."
            }
            $preview = Invoke-RestMethod -Uri "http://127.0.0.1:8787/companion/v1/aim-preview?ballX=0&ballZ=0&pinX=0&pinZ=100&targetX=0&targetZ=50" -Headers $headers -TimeoutSec 10
            if ($preview.schemaVersion -ne "looper-companion-aim-preview-v1" -or $preview.input -ne "none" -or $preview.status -ne "gspro-not-connected") {
              throw "Aim preview must answer gspro-not-connected without GSPro: $($preview | ConvertTo-Json -Compress)"
            }
            if ($companion.capabilities.aimClick -ne $true -or $companion.capabilities.autoAim -ne $false) {
              throw "Aim click capability missing (or background auto aim unexpectedly on)."
            }
            $clickHeaders = @{ Origin = "https://thelooper.golf"; "X-Looper-Intent" = "aim-click" }
            $clickBody = '{"ballX":0,"ballZ":0,"pinX":0,"pinZ":100,"targetX":0,"targetZ":50,"shotKey":"smoke"}'
            $click = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8787/companion/v1/aim-click" -Headers $clickHeaders -ContentType "application/json" -Body $clickBody -TimeoutSec 10
            if ($click.schemaVersion -ne "looper-companion-aim-click-v1" -or $click.status -ne "blocked" -or $click.reason -ne "gspro-not-connected") {
              throw "Aim click must refuse without GSPro: $($click | ConvertTo-Json -Compress)"
            }
            if ($companion.capabilities.courseLibrary -ne $true) {
              throw "Course library capability missing."
            }
            $library = Invoke-RestMethod -Uri "http://127.0.0.1:8787/companion/v1/course-library" -Headers $headers -TimeoutSec 20
            if ($library.schemaVersion -ne "looper-companion-course-library-v1" -or $library.status -ne "not-found") {
              throw "Course library must answer not-found without GSPro courses: $($library | ConvertTo-Json -Compress)"
            }
            if ($companion.capabilities.autoAim -ne $false) {
              throw "Stage B must never enable Auto Aim."
            }
            if ($companion.capabilities.gsproFiles -ne $true -or $companion.capabilities.roundRecorder -ne $true) {
              throw "GSPro file bridge or round recorder missing from packaged build."
            }
            $fileStat = Invoke-RestMethod -Uri "http://127.0.0.1:8787/companion/v1/gspro-file?name=currentRound.dat&stat=1" -Headers $headers -TimeoutSec 10
            if ($fileStat.status -ne "gspro-folder-not-found" -and $fileStat.status -ne "not-found") {
              throw "GSPro file stat must fail closed without GSPro: $($fileStat | ConvertTo-Json -Compress)"
            }
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:8787/companion/v1/gspro-file?name=..%5Cnotes.txt" -Headers $headers -TimeoutSec 5 | Out-Null
              throw "Non-allowlisted file name was served."
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 403) { throw }
            }
            $records = Invoke-RestMethod -Uri "http://127.0.0.1:8787/companion/v1/round-records?after=0" -Headers $headers -TimeoutSec 10
            if ($records.schemaVersion -ne "looper-companion-round-records-v1" -or $records.status -ne "ok") {
              throw "Round records endpoint missing: $($records | ConvertTo-Json -Compress)"
            }

            # Tesseract must ship next to packaged executable, and be capable
            # of OCR without relying on a system-wide install.
            if (!(Test-Path "portable-ocr/tesseract.exe") -or !(Test-Path "portable-ocr/tessdata/eng.traineddata")) {
              throw "Portable OCR bundle was not assembled."
            }
            $engineVersion = & "portable-ocr/tesseract.exe" --version 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Bundled OCR executable could not launch." }

            # GSPro is intentionally absent on CI. These calls prove that the
            # packaged wind/lie endpoints are present and fail closed instead
            # of crashing when no GSPro window exists.
            $wind = Invoke-RestMethod -Uri "http://127.0.0.1:8787/wind" -TimeoutSec 12
            $lie = Invoke-RestMethod -Uri "http://127.0.0.1:8787/lie" -TimeoutSec 15
            if ($null -eq $wind.status -or $null -eq $lie.status) {
              throw "Packaged wind/lie endpoints did not return status payloads."
            }
          } finally {
            if ($process -and !$process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Assemble install package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item dist/LooperCompanion.exe package/LooperCompanion.exe
          Copy-Item -Path portable-ocr -Destination package/ocr -Recurse -Force
          Copy-Item helpers/install_looper_companion.ps1 package/install_looper_companion.ps1
          Copy-Item helpers/install_looper_companion.cmd package/install_looper_companion.cmd
          Copy-Item helpers/uninstall_looper_companion.ps1 package/uninstall_looper_companion.ps1
          Compress-Archive -Path package/* -DestinationPath looper-windows-companion.zip -Force

      # Players get ONE file to double-click: no unzip, no .cmd. The ZIP above
      # stays as a fallback and for older links.
      - name: Build the one-file installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup could not be installed." }
          }
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found." }
          $release = (Select-String -Path helpers/looper_companion.py -Pattern 'COMPANION_RELEASE = "([^"]+)"').Matches[0].Groups[1].Value
          Copy-Item helpers/looper_companion_setup.iss looper_companion_setup.iss
          & $iscc "/DAppVersion=$release" looper_companion_setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed." }
          if (!(Test-Path LooperCompanionSetup.exe)) { throw "LooperCompanionSetup.exe was not produced." }
          Write-Host ("installer: {0:N0} bytes" -f (Get-Item LooperCompanionSetup.exe).Length)

      - name: Test the one-file installer end to end
        shell: pwsh
        run: |
          function Wait-Health {
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $h = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 2
                if ($h.status -eq "ok") { return $true }
              } catch {}
            }
            return $false
          }
          $installDir = Join-Path $env:LOCALAPPDATA "Looper\Companion"
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Looper Companion.lnk"
          foreach ($pass in "fresh install", "upgrade over a running copy") {
            # Not -Wait: that also waits for the companion the installer starts, which never exits.
            $p = Start-Process -FilePath ".\LooperCompanionSetup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
            if (!$p.WaitForExit(180000)) { throw "$pass`: installer did not finish in 3 minutes" }
            if ($p.ExitCode -ne 0) { throw "$pass`: installer exit code $($p.ExitCode)" }
            if (!(Test-Path (Join-Path $installDir "LooperCompanion.exe"))) { throw "$pass`: exe not installed" }
            if (!(Test-Path (Join-Path $installDir "ocr\tesseract.exe"))) { throw "$pass`: OCR engine not installed" }
            if (!(Test-Path (Join-Path $installDir "ocr\tessdata\eng.traineddata"))) { throw "$pass`: OCR data not installed" }
            if (!(Test-Path $shortcut)) { throw "$pass`: Start menu shortcut missing" }
            $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").LooperCompanion
            if ($run -notlike "*LooperCompanion.exe*") { throw "$pass`: start-with-Windows entry missing" }
            if (!(Wait-Health)) { throw "$pass`: the installed companion never answered on /health" }
            $running = Get-Process -Name LooperCompanion -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" }
            if (!$running) { throw "$pass`: the running companion is not the installed copy" }
            Write-Host "$pass`: ok"
          }
          $status = Invoke-RestMethod -Uri "http://127.0.0.1:8787/companion/v1/status" -Headers @{ Origin = "https://thelooper.golf" } -TimeoutSec 5
          Write-Host "installed companion release: $($status.release)"
          # Uninstall leaves nothing running and removes the start-with-Windows entry.
          $un = Get-ChildItem $installDir -Filter "unins*.exe" | Select-Object -First 1
          if (!$un) { throw "uninstaller missing" }
          $u = Start-Process -FilePath $un.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          $u.WaitForExit(120000) | Out-Null
          # The uninstaller re-launches itself from a temp copy; give that copy time to finish.
          for ($i = 0; $i -lt 30 -and (Test-Path $un.FullName); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 2
          if (Get-Process -Name LooperCompanion -ErrorAction SilentlyContinue) { throw "uninstall left the companion running" }
          $runAfter = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue).LooperCompanion
          if ($runAfter) { throw "uninstall left the start-with-Windows entry" }
          if (Test-Path $shortcut) { throw "uninstall left the Start menu shortcut" }
          Write-Host "uninstall: ok"

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LooperCompanionSetup
          path: LooperCompanionSetup.exe
          retention-days: 14

      - name: Publish isolated Stage C preflight prerelease
        continue-on-error: true
        if: github.ref == 'refs/heads/auto-aim-windows-companion-v1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          $tag = "looper-companion-autoaim-stage-c-$shortSha"
          gh release create $tag looper-windows-companion.zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Looper Companion Auto Aim Stage C Preflight ($shortSha)" `
            --notes "Isolated Windows development installer with original physically proven minimap CV/math packaged. Read-only diagnostics only. Native input and browser aim commands remain disabled." `
            --prerelease

      - name: Publish isolated unified course-positioning companion prerelease
        if: github.ref == 'refs/heads/unified-imported-course-positioning-v1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          $tag = "looper-companion-unified-course-$shortSha"
          gh release create $tag looper-windows-companion.zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Looper Unified Course Positioning Research ($shortSha)" `
            --notes "Isolated read-only Windows Companion development build: updated near-white gray-waypoint OCR and scale diagnostics for imported courses. No Auto Aim click/input. Test only with a separate branch-only Looper preview." `
            --prerelease

      - name: Publish course-layouts companion installer
        if: github.ref == 'refs/heads/companion-course-layouts-v1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          gh release create "looper-companion-course-layouts-$shortSha" looper-windows-companion.zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Looper Companion: course layouts for native positions ($shortSha)" `
            --notes "Read-only /companion/v1/course-layouts: finds the course's .GKD/.GKDalt in the GSPro library (Courses beside GSPro, C:\GSProV1\Courses, or LOOPER_GSPRO_COURSES_DIR) so the web app's Native positions (beta) needs no folder grant. No paths leave the machine. No native input or Auto Aim." `
            --prerelease

      - name: Publish aim-preview companion installer
        if: github.ref == 'refs/heads/web-native-aim-preview-v1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          gh release create "looper-companion-aim-preview-$shortSha" looper-windows-companion.zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Looper Companion: Auto Aim preview ($shortSha)" `
            --notes "Course layouts plus read-only /companion/v1/aim-preview: one capture of GSPro's minimap, finds the red ball and white pin dots, and shows where Looper WOULD click for its aim. No mouse or keyboard input." `
            --prerelease

      - name: Publish course-load companion installer
        if: github.ref == 'refs/heads/web-course-load-v1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          gh release create "looper-companion-course-load-$shortSha" looper-windows-companion.zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Looper Companion: course library + aim preview ($shortSha)" `
            --notes "Course layouts, read-only Auto Aim preview, and read-only /companion/v1/course-library (names, locations and keys of installed GSPro courses for one-click loading). No mouse or keyboard input." `
            --prerelease

      - name: Publish courses companion installer
        if: github.ref == 'refs/heads/web-native-rotated-courses-v1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          gh release create "looper-companion-courses-$shortSha" looper-windows-companion.zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Looper Companion courses.10 ($shortSha)" `
            --notes "Version courses.10. Records GSPro's own par for every hole of each round (from the hole layout GSPro logs, checked against that round's pins) and serves it at /companion/v1/round-pars, so Rounds scores with GSPro's scorecard par (The Old Game: hole 7 is a par 5 in GSPro, a 4 in its course file). Read-only. Otherwise the same as courses.9 (wind diagnostic, course list with pars and style tags, aim click, wind/lie/HUD reads, round recorder)." `
            --prerelease

      - name: Publish Rounds companion installer
        if: github.ref == 'refs/heads/web-rounds-history-v1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          gh release create "looper-companion-rounds-$shortSha" looper-windows-companion.zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Looper Companion: par for Rounds ($shortSha)" `
            --notes "Version courses.8. The course list now includes each hole's par (for the Rounds scorecard) and the designer's style tags (links, parkland, mountain...); single-course lookups search as far as the course list (large libraries). Otherwise the same as courses.6 (finds courses with GSPro closed, aim click, wind/lie/HUD reads, round recorder)." `
            --prerelease

      - name: Publish GSPro-files companion installer
        if: github.ref == 'refs/heads/web-companion-gspro-files-v1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          gh release create "looper-companion-gspro-files-$shortSha" looper-windows-companion.zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Looper Companion: GSPro files + round recorder ($shortSha)" `
            --notes "Serves GSPro's currentRound.dat, output_log.txt and GSPro.db to the Looper web app (read-only, allowlisted, no paths), so no GSPro folder picker is needed. Keeps every round's raw records under %LOCALAPPDATA%\Looper\Companion\rounds. No mouse or keyboard input." `
            --prerelease

      - name: Publish rolling companion prerelease
        if: github.ref == 'refs/heads/web-course-importer-surface-semantics-v2'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view looper-companion-latest --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete looper-companion-latest --repo "$env:GITHUB_REPOSITORY" --yes --cleanup-tag
          }
          gh release create looper-companion-latest `
            looper-windows-companion.zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Looper Windows Companion (latest)" `
            --notes "Rolling Windows companion build for the hosted Looper web app. Install once; it runs in the background and starts with Windows." `
            --prerelease

      # Players get the companion from a public, releases-only repo
      # (COMPANION_RELEASES_REPO). Runs on the production branch when the
      # release number in helpers/looper_companion.py has no release yet.
      # latest.json there is what the web app reads for "update available".
      # Needs the COMPANION_RELEASES_TOKEN secret: a fine-grained PAT with
      # Contents: read and write on that repo only.
      - name: Publish to the public releases repo
        if: github.ref == 'refs/heads/web-alpha-mishits'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.COMPANION_RELEASES_TOKEN }}
          COMPANION_RELEASES_REPO: bpgpitt10/looper-companion-releases
          MIN_RELEASE: "1.0.0"
        run: |
          if (-not $env:GH_TOKEN) { Write-Host "COMPANION_RELEASES_TOKEN not set; skipping the public publish."; exit 0 }
          $release = (Select-String -Path helpers/looper_companion.py -Pattern 'COMPANION_RELEASE = "([^"]+)"').Matches[0].Groups[1].Value
          $tag = "v$release"
          gh release view $tag --repo $env:COMPANION_RELEASES_REPO *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag is already published; bump COMPANION_RELEASE to ship a new build."; exit 0 }
          $notes = (git log -1 --pretty=%s)
          gh release create $tag LooperCompanionSetup.exe looper-windows-companion.zip `
            --repo $env:COMPANION_RELEASES_REPO `
            --title "Looper Companion $release" `
            --notes "$notes`n`nInstall: download LooperCompanionSetup.exe and run it. It runs in the background and starts with Windows. (The zip is the old manual installer.) Built from nova-v0 $env:GITHUB_SHA."
          if ($LASTEXITCODE -ne 0) { throw "public release failed" }
          $sha = (Get-FileHash LooperCompanionSetup.exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item LooperCompanionSetup.exe).Length
          $latest = @{
            release = $release
            minRelease = $env:MIN_RELEASE
            url = "https://github.com/$env:COMPANION_RELEASES_REPO/releases/download/$tag/LooperCompanionSetup.exe"
            sha256 = $sha
            sizeBytes = $size
            publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            notes = $notes
            source = "nova-v0@$env:GITHUB_SHA"
          } | ConvertTo-Json
          function Put-File($path, $content, $message) {
            $existing = gh api "repos/$env:COMPANION_RELEASES_REPO/contents/$path" --jq .sha 2>$null
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($content))
            $args = @("-X", "PUT", "repos/$env:COMPANION_RELEASES_REPO/contents/$path", "-f", "message=$message", "-f", "content=$b64")
            if ($existing) { $args += @("-f", "sha=$existing") }
            gh api @args > $null
            if ($LASTEXITCODE -ne 0) { throw "could not write $path" }
          }
          Put-File "latest.json" $latest "Looper Companion $release"
          $readme = Get-Content helpers/companion-releases-README.md -Raw
          Put-File "README.md" $readme "README for Looper Companion $release"
          Write-Host "published $tag to $env:COMPANION_RELEASES_REPO"
