name: Live Shot StartingPOS Audit CI

on:
  push:
    branches:
      - live-shot-state-startingpos-audit-v4
  pull_request:
    paths:
      - 'src/adapters/gsproStartingPosition.ts'
      - 'src/adapters/reliableBrowserGsproCourseState.ts'
      - 'tools/diagnose-gspro-preshot.mjs'
      - 'tools/diagnose-gspro-preshot.test.mjs'
      - '.github/workflows/live-shot-startingpos-audit-ci.yml'

jobs:
  deterministic-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run pre-shot diagnostic tests
        run: node --test tools/diagnose-gspro-preshot.test.mjs
      - name: Build browser app
        run: npm run build
