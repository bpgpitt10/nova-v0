name: Course surface semantics CI

on:
  push:
    branches:
      - course-importer-surface-semantics-v1
      - web-course-importer-surface-semantics-v1
    paths:
      - tools/build_osm_course_package_v7.py
      - tools/build_osm_course_package_canonical.py
      - tools/test_course_surface_semantics_v7.py
      - tools/test-course-surface-classification.mjs
      - tools/test-augusta-championship-package.mjs
      - src/courseGeometry/semantics.ts
      - src/courseGeometry/geometry.ts
      - src/courseGeometry/routePackagedCourseLoader.ts
      - public/course-geometry/**/course-v1.json
      - .github/workflows/course-surface-semantics-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-hole-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geometry dependency
        run: pip install -r requirements-course-geometry.txt

      - name: Validate one real imported hole
        run: python tools/test_course_surface_semantics_v7.py

      - name: Install app dependencies
        run: npm ci --ignore-scripts

      - name: Validate runtime surface precedence
        run: node tools/test-course-surface-classification.mjs

      - name: Guard Augusta championship package and package freshness
        run: node tools/test-augusta-championship-package.mjs
