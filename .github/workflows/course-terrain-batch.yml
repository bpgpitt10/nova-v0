name: Generic course terrain batch

on:
  push:
    branches:
      - course-lidar-importer-v1
    paths:
      - tools/build_course_terrain.py
      - tools/verify_course_terrain_source.py
      - tools/bind_course_terrain_proof.py
      - tools/requirements-course-terrain.txt
      - config/course-geometry/arcadia-bluffs-v1.json
      - config/course-geometry/cabot-cliffs-v1.json
      - config/course-geometry/pebble-beach-v1.json
      - .github/workflows/course-terrain-batch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-terrain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-lidar-importer-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install terrain compiler dependencies
        run: pip install --quiet -r tools/requirements-course-terrain.txt

      - name: Syntax-check terrain tooling
        run: python -m py_compile tools/build_course_terrain.py tools/verify_course_terrain_source.py tools/bind_course_terrain_proof.py

      - name: Verify source-quality coverage
        id: source_proof
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          source_status=0
          for slug in arcadia-bluffs cabot-cliffs pebble-beach; do
            case "$slug" in
              arcadia-bluffs) config="config/course-geometry/arcadia-bluffs-v1.json" ;;
              cabot-cliffs) config="config/course-geometry/cabot-cliffs-v1.json" ;;
              pebble-beach) config="config/course-geometry/pebble-beach-v1.json" ;;
            esac
            echo "=== terrain source proof: $slug ==="
            python tools/verify_course_terrain_source.py \
              --osm "artifacts/course-geometry/$slug/osm-snapshot.json" \
              --config "$config" \
              --output "artifacts/course-geometry/$slug/terrain-source-proof-v1.json" \
              || source_status=1
          done
          exit "$source_status"

      - name: Build and bind Arcadia, Cabot, and Pebble terrain caches
        if: steps.source_proof.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for slug in arcadia-bluffs cabot-cliffs pebble-beach; do
            case "$slug" in
              arcadia-bluffs) config="config/course-geometry/arcadia-bluffs-v1.json" ;;
              cabot-cliffs) config="config/course-geometry/cabot-cliffs-v1.json" ;;
              pebble-beach) config="config/course-geometry/pebble-beach-v1.json" ;;
            esac
            echo "=== terrain: $slug ==="
            build_ok=0
            for attempt in 1 2 3 4; do
              echo "terrain acquisition/build attempt $attempt/4 for $slug"
              if python tools/build_course_terrain.py \
                --osm "artifacts/course-geometry/$slug/osm-snapshot.json" \
                --config "$config" \
                --geometry "public/course-geometry/$slug/course-v1.json" \
                --output "public/course-geometry/$slug/terrain-v1.json" \
                --validation "artifacts/course-geometry/$slug/terrain-validation-v1.json" \
                --cache "artifacts/course-geometry/$slug/terrain-cache-v1.json"; then
                build_ok=1
                break
              fi
              if [ "$attempt" -lt 4 ]; then
                sleep $((attempt * 5))
              fi
            done
            if [ "$build_ok" -ne 1 ]; then
              echo "terrain acquisition/build failed after 4 attempts for $slug"
              exit 1
            fi
            python tools/bind_course_terrain_proof.py \
              --config "$config" \
              --proof "artifacts/course-geometry/$slug/terrain-source-proof-v1.json" \
              --validation "artifacts/course-geometry/$slug/terrain-validation-v1.json" \
              --package "public/course-geometry/$slug/terrain-v1.json" \
              --cache "artifacts/course-geometry/$slug/terrain-cache-v1.json"
          done

      - name: Verify all three terrain packages passed
        if: steps.source_proof.outcome == 'success'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          for slug in ('arcadia-bluffs', 'cabot-cliffs', 'pebble-beach'):
              root = Path('artifacts/course-geometry') / slug
              proof_path = root / 'terrain-source-proof-v1.json'
              validation_path = root / 'terrain-validation-v1.json'
              cache_path = root / 'terrain-cache-v1.json'
              package_path = Path('public/course-geometry') / slug / 'terrain-v1.json'
              proof = json.loads(proof_path.read_text())
              data = json.loads(validation_path.read_text())
              cache = json.loads(cache_path.read_text())
              assert proof['passed'] is True, (slug, 'source proof failed')
              assert data['allHolesTerrainReady'] is True, (slug, data['readyHoles'])
              assert data['readyHoleCount'] == 18, (slug, data['readyHoleCount'])
              assert cache['sourceProofSha256'] == sha(proof_path), (slug, 'proof hash mismatch')
              assert cache['validationSha256'] == sha(validation_path), (slug, 'validation hash mismatch')
              assert cache['terrainPackageSha256'] == sha(package_path), (slug, 'package hash mismatch')
              assert cache['qualityGate']['sourceProofPassed'] is True
              assert cache['qualityGate']['allHolesTerrainReady'] is True
              print(f"{slug}: PASS source + 18/18 terrain + bound cache; provider={data['provider']}")
          PY

      - name: Persist normalized terrain caches
        if: steps.source_proof.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/course-geometry/arcadia-bluffs/terrain-v1.json \
            public/course-geometry/cabot-cliffs/terrain-v1.json \
            public/course-geometry/pebble-beach/terrain-v1.json \
            artifacts/course-geometry/arcadia-bluffs/terrain-source-proof-v1.json \
            artifacts/course-geometry/arcadia-bluffs/terrain-validation-v1.json \
            artifacts/course-geometry/arcadia-bluffs/terrain-cache-v1.json \
            artifacts/course-geometry/cabot-cliffs/terrain-source-proof-v1.json \
            artifacts/course-geometry/cabot-cliffs/terrain-validation-v1.json \
            artifacts/course-geometry/cabot-cliffs/terrain-cache-v1.json \
            artifacts/course-geometry/pebble-beach/terrain-source-proof-v1.json \
            artifacts/course-geometry/pebble-beach/terrain-validation-v1.json \
            artifacts/course-geometry/pebble-beach/terrain-cache-v1.json
          if git diff --cached --quiet; then
            echo "Terrain caches unchanged"
          else
            git commit -m "Build verified terrain for Arcadia Cabot and Pebble"
            git fetch origin course-lidar-importer-v1
            git rebase origin/course-lidar-importer-v1
            git push origin HEAD:course-lidar-importer-v1
          fi

      - name: Fail batch when any source proof failed
        if: steps.source_proof.outcome != 'success'
        run: |
          echo "At least one course failed the terrain source-quality gate. See source-proof logs above."
          exit 1
