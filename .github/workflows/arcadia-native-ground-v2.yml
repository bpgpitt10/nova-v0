name: Arcadia Native Ground V2

on:
  push:
    branches:
      - course-importer-surface-semantics-v1
    paths:
      - '.github/workflows/arcadia-native-ground-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical importer branch
        uses: actions/checkout@v4
        with:
          ref: course-importer-surface-semantics-v1
          fetch-depth: 0

      - name: Reuse native-ground patch with standard OSM boundary tag
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/arcadia-context-selector-fix.yml').read_text(encoding='utf-8')
          marker = "python - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('Could not find patch script in prior workflow')
          script = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          script = textwrap.dedent(script)
          old = 'if golf == "course":\\n        return "context", "course-boundary"'
          new = 'if golf == "course" or tags.get("leisure") == "golf_course":\\n        return "context", "course-boundary"'
          if old not in script:
              raise SystemExit('Could not patch course boundary classifier in extracted script')
          script = script.replace(old, new, 1)
          Path('/tmp/arcadia-native-ground-patch.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/arcadia-native-ground-patch.py

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geometry dependencies
        run: pip install -r requirements-course-geometry.txt

      - name: Preserve current Arcadia terrain
        run: |
          mkdir -p /tmp/arcadia-context
          cp public/course-geometry/arcadia-bluffs/course-v1.json /tmp/arcadia-context/old-package.json

      - name: Refresh exact Arcadia OSM snapshot
        run: |
          python tools/fetch_osm_course_snapshot_core.py \
            --config config/course-geometry/arcadia-bluffs-v1.json \
            --output artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json

      - name: Rebuild Arcadia with native course ground
        run: |
          python tools/build_osm_course_package_canonical.py \
            --osm artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json \
            --config config/course-geometry/arcadia-bluffs-v1.json \
            --output /tmp/arcadia-context/geometry.json \
            --manifest artifacts/course-geometry/arcadia-bluffs/validation-v1.json
          python tools/carry_forward_embedded_terrain.py \
            --old-package /tmp/arcadia-context/old-package.json \
            --new-package /tmp/arcadia-context/geometry.json \
            --output public/course-geometry/arcadia-bluffs/course-v1.json
          python tools/update_course_cache_after_rebuild.py \
            --cache artifacts/course-geometry/arcadia-bluffs/cache-v1.json \
            --config config/course-geometry/arcadia-bluffs-v1.json \
            --snapshot artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json \
            --package public/course-geometry/arcadia-bluffs/course-v1.json \
            --manifest artifacts/course-geometry/arcadia-bluffs/validation-v1.json

      - name: Audit Hole 9 context
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(Path('public/course-geometry/arcadia-bluffs/course-v1.json').read_text())
          hole = package['holes']['9']
          context = hole.get('context') or {}
          result = {
              'contextPolygons': {k: len(v) for k, v in sorted(context.items()) if isinstance(v, list)},
              'surfacePolygons': {k: len(v) for k, v in sorted((hole.get('surfaces') or {}).items()) if isinstance(v, list)},
          }
          Path('artifacts/course-geometry/arcadia-bluffs/hole-09-context-audit-v1.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          if len(context.get('native-ground') or []) == 0:
              raise SystemExit('Hole 9 still has no derived native-ground context')
          PY

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate runtime
        run: |
          npm ci
          npm run build
          npm run courses:audit-runtime -- --strict --candidate arcadia-bluffs

      - name: Commit derived context and rebuilt Arcadia
        run: |
          git add \
            tools/build_osm_course_package.py \
            tools/fetch_osm_course_snapshot_core.py \
            tools/build_osm_course_package_v4.py \
            tools/build_osm_course_package_v5.py \
            config/course-geometry/arcadia-bluffs-v1.json \
            src/courseGeometry/types.ts \
            src/courseGeometry/routePackagedCourseLoader.ts \
            src/pages/LiveCaddiePage.tsx \
            src/pages/LiveCaddiePage.css \
            artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json \
            artifacts/course-geometry/arcadia-bluffs/validation-v1.json \
            artifacts/course-geometry/arcadia-bluffs/cache-v1.json \
            artifacts/course-geometry/arcadia-bluffs/hole-09-context-audit-v1.json \
            public/course-geometry/arcadia-bluffs/course-v1.json \
            src/courseGeometry/generatedRouteHoleHeadings.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(course): derive native ground for unmapped Arcadia interior'
          git push origin HEAD:course-importer-surface-semantics-v1
