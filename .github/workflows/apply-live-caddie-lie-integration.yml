name: Final LIVE Caddie OCR integration audit

on:
  push:
    branches:
      - web-live-caddie-ocr-ready-v2
    paths:
      - '.github/workflows/apply-live-caddie-lie-integration.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: web-live-caddie-ocr-ready-v2
          fetch-depth: 0

      - name: Apply explicit loopback fetch intent
        run: python tools/apply-loopback-fetch.py

      - name: Assert no native shell files were introduced by this branch
        shell: bash
        run: |
          git diff --name-only 506f3f355d5f6cdcc44ea02bc37a5d77570ffb6c...HEAD > /tmp/changed.txt
          if grep -Ei '(^|/)(src-tauri|electron)(/|$)|tauri|electron' /tmp/changed.txt; then
            echo 'Native-shell file detected in LIVE Caddie OCR branch.' >&2
            exit 1
          fi

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build browser app
        run: npm run build

      - name: Commit validated loopback integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/gsproWindObservation.ts src/adapters/gsproLieObservation.ts
          git diff --cached --check
          git commit -m "fix(live-caddie): declare OCR helper as loopback [lna]"
          git push origin HEAD:web-live-caddie-ocr-ready-v2
