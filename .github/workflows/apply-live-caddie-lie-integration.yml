name: Apply LIVE Caddie lie integration

on:
  push:
    branches:
      - web-live-caddie-ocr-ready-v2
    paths:
      - '.github/workflows/apply-live-caddie-lie-integration.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: web-live-caddie-ocr-ready-v2
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python tools/apply-live-caddie-lie-integration.py

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build browser app
        run: npm run build

      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/liveCaddie/aimOptimization.ts \
                  src/liveCaddie/shotContextModel.ts \
                  src/liveCaddie/modelContract.ts \
                  src/pages/LiveCaddiePage.tsx \
                  src/pages/ConditionsMathPanel.tsx \
                  src/pages/LiveCaddieWorker.ts
          git diff --cached --check
          git commit -m "feat(live-caddie): wire OCR lie into decisions [lie-patch]"
          git push origin HEAD:web-live-caddie-ocr-ready-v2
