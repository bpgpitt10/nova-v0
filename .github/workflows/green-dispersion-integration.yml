name: Integrate green dispersion fidelity

on:
  push:
    branches:
      - exact-pin-outputlog-v1
    paths:
      - .github/workflows/green-dispersion-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exact-pin-outputlog-v1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Patch green dispersion integration
        run: python tools/patch_green_dispersion_v1.py

      - run: npm ci
      - run: npm run build

      - name: Persist integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/liveCaddie/aimOptimization.ts src/pages/LiveCaddiePage.tsx src/pages/LiveCaddieWorker.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Green dispersion integration already applied"
          else
            git commit -m "Use green LiDAR across the dispersion cloud"
            git fetch origin exact-pin-outputlog-v1
            git rebase origin/exact-pin-outputlog-v1
            git push origin HEAD:exact-pin-outputlog-v1
          fi
