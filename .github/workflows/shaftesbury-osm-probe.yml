name: Shaftesbury OSM structure probe

on:
  push:
    branches:
      - course-importer-cache-v1
    paths:
      - .github/workflows/shaftesbury-osm-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-importer-cache-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe OSM structure near verified Shaftesbury location
        run: |
          python - <<'PY'
          import json
          import sys
          sys.path.insert(0, 'tools')
          from fetch_osm_course_snapshot import fetch_overpass_query

          lat, lon = 33.88958, -78.90363

          def fetch(label, query):
              raced = fetch_overpass_query(query)
              print(f'=== {label} endpoint={raced["endpoint"]} ===')
              return raced['payload'].get('elements') or []

          identity = fetch('IDENTITY', f'''[out:json][timeout:40];
          (
            node(around:2500,{lat},{lon})["leisure"="golf_course"];
            way(around:2500,{lat},{lon})["leisure"="golf_course"];
            rel(around:2500,{lat},{lon})["leisure"="golf_course"];
            node(around:2500,{lat},{lon})["name"~"Shaftesbury",i];
            way(around:2500,{lat},{lon})["name"~"Shaftesbury",i];
            rel(around:2500,{lat},{lon})["name"~"Shaftesbury",i];
          );
          out tags center;
          ''')

          holes_raw = fetch('HOLES', f'''[out:json][timeout:40];
          (
            way(around:2200,{lat},{lon})["golf"="hole"];
            rel(around:2200,{lat},{lon})["golf"="hole"];
          );
          out tags center;
          ''')

          surfaces_raw = fetch('SURFACES', f'''[out:json][timeout:40];
          (
            way(around:2200,{lat},{lon})["golf"~"^(tee|fairway|green|bunker|rough)$"];
            rel(around:2200,{lat},{lon})["golf"~"^(tee|fairway|green|bunker|rough)$"];
          );
          out tags center;
          ''')

          def slim(el):
              tags = el.get('tags') or {}
              return {
                  'type': el.get('type'), 'id': el.get('id'),
                  'name': tags.get('name'), 'leisure': tags.get('leisure'),
                  'golf': tags.get('golf'), 'ref': tags.get('ref'),
                  'par': tags.get('par'), 'center': el.get('center'),
              }

          holes = [slim(el) for el in holes_raw]
          holes.sort(key=lambda x: (int(x['ref']) if str(x.get('ref') or '').isdigit() else 999, str(x.get('ref'))))
          counts = {}
          for el in surfaces_raw:
              golf = (el.get('tags') or {}).get('golf')
              counts[golf] = counts.get(golf, 0) + 1
          print(json.dumps({
              'identityObjects': [slim(el) for el in identity],
              'holeCount': len(holes),
              'holes': holes,
              'surfaceCounts': counts,
          }, indent=2))
          PY
