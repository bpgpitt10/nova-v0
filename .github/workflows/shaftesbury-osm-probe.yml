name: Shaftesbury OSM structure probe

on:
  push:
    branches:
      - course-importer-cache-v1
    paths:
      - .github/workflows/shaftesbury-osm-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-importer-cache-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe OSM structure near verified Shaftesbury location
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          bbox = '-78.9200,33.8800,-78.8900,33.9020'
          url = f'https://api.openstreetmap.org/api/0.6/map?bbox={bbox}'
          req = urllib.request.Request(url, headers={'User-Agent': 'LooperCourseProbe/0.1'})
          with urllib.request.urlopen(req, timeout=120) as response:
              raw = response.read()
          print('bytes', len(raw))
          root = ET.fromstring(raw)

          nodes = {}
          objects = []
          for child in root:
              if child.tag == 'node':
                  try:
                      nodes[int(child.attrib['id'])] = (float(child.attrib['lat']), float(child.attrib['lon']))
                  except Exception:
                      pass
              if child.tag not in {'node', 'way', 'relation'}:
                  continue
              tags = {tag.attrib.get('k'): tag.attrib.get('v') for tag in child.findall('tag')}
              if not tags:
                  continue
              objects.append((child, tags))

          def way_center(el):
              pts = [nodes.get(int(nd.attrib['ref'])) for nd in el.findall('nd') if nd.attrib.get('ref')]
              pts = [p for p in pts if p]
              if not pts:
                  return None
              return {'lat': sum(p[0] for p in pts)/len(pts), 'lon': sum(p[1] for p in pts)/len(pts)}

          def slim(el, tags):
              center = None
              if el.tag == 'node':
                  center = {'lat': float(el.attrib['lat']), 'lon': float(el.attrib['lon'])}
              elif el.tag == 'way':
                  center = way_center(el)
              return {
                  'type': el.tag, 'id': int(el.attrib['id']), 'center': center,
                  'name': tags.get('name'), 'leisure': tags.get('leisure'),
                  'golf': tags.get('golf'), 'ref': tags.get('ref'), 'par': tags.get('par')
              }

          identity = []
          holes = []
          counts = {}
          for el, tags in objects:
              if tags.get('leisure') == 'golf_course' or 'shaftesbury' in str(tags.get('name') or '').lower():
                  identity.append(slim(el, tags))
              golf = tags.get('golf')
              if golf:
                  counts[golf] = counts.get(golf, 0) + 1
              if golf == 'hole':
                  holes.append(slim(el, tags))

          holes.sort(key=lambda x: (int(x['ref']) if str(x.get('ref') or '').isdigit() else 999, str(x.get('ref'))))
          print(json.dumps({
              'bbox': bbox,
              'nodeCount': len(nodes),
              'taggedObjectCount': len(objects),
              'identityObjects': identity,
              'golfCounts': counts,
              'holeCount': len(holes),
              'holes': holes,
          }, indent=2))
          PY
