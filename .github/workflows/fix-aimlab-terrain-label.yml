name: Fix Aim Lab terrain source label

on:
  push:
    branches:
      - course-geometry-tactical-v0
    paths:
      - .github/workflows/fix-aimlab-terrain-label.yml

permissions:
  contents: write

jobs:
  patch-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-geometry-tactical-v0

      - name: Make terrain source label follow loaded hole terrain
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/dev/AimLabPage.tsx')
          text = path.read_text(encoding='utf-8')
          before = "{holeNumber === 1 ? 'LiDAR contour proxy' : 'LiDAR DEM bridge pending'}"
          after = "{ballTerrain && targetTerrain ? (ballTerrain.source === 'lidar-dem' && targetTerrain.source === 'lidar-dem' ? 'LiDAR DEM' : 'LiDAR contour proxy') : 'No terrain model'}"
          if before not in text:
              raise SystemExit('Expected stale Hole 1 terrain source label not found')
          text = text.replace(before, after, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit Step 4 cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-aimlab-terrain-label.yml
          git add src/dev/AimLabPage.tsx
          git commit -m "Finish course-wide terrain wiring in Aim Lab"
          git fetch origin course-geometry-tactical-v0
          git rebase origin/course-geometry-tactical-v0
          git push origin HEAD:course-geometry-tactical-v0
