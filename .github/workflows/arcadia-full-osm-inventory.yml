name: Arcadia Full OSM Inventory

on:
  push:
    branches:
      - web-course-importer-surface-semantics-v2
    paths:
      - '.github/workflows/arcadia-full-osm-inventory.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: web-course-importer-surface-semantics-v2
          fetch-depth: 0

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geometry dependency
        run: pip install -r requirements-course-geometry.txt

      - name: Inventory raw OSM features inside Arcadia boundary
        run: |
          python - <<'PY'
          import json
          import sys
          import urllib.request
          import xml.etree.ElementTree as ET
          from collections import Counter, defaultdict
          from pathlib import Path

          from shapely.geometry import LineString, Point, Polygon
          from shapely.validation import make_valid

          sys.path.insert(0, 'tools')
          import fetch_osm_course_snapshot as fetcher
          import fetch_osm_course_snapshot_core as core

          config = json.loads(Path('config/course-geometry/arcadia-bluffs-v1.json').read_text())
          source, _ = fetcher.fetch_source_element(config, 45)
          boundary = fetcher.boundary_shape(source)
          envelope = boundary.buffer(fetcher.BOUNDARY_TOLERANCE_DEG)

          min_lon, min_lat, max_lon, max_lat = boundary.bounds
          margin = core.MAP_MARGIN_DEG
          url = (
              f'{fetcher.OSM_API_BASE}/map?bbox='
              f'{min_lon-margin:.8f},{min_lat-margin:.8f},{max_lon+margin:.8f},{max_lat+margin:.8f}'
          )
          request = urllib.request.Request(url, headers={'User-Agent': fetcher.USER_AGENT}, method='GET')
          with urllib.request.urlopen(request, timeout=65) as response:
              root = ET.fromstring(response.read())

          def tags_for(element):
              return {
                  tag.attrib.get('k', ''): tag.attrib.get('v', '')
                  for tag in element.findall('tag')
                  if tag.attrib.get('k')
              }

          nodes = {}
          node_xml = {}
          for node in root.findall('node'):
              try:
                  node_id = int(node.attrib['id'])
                  lon = float(node.attrib['lon'])
                  lat = float(node.attrib['lat'])
              except (KeyError, TypeError, ValueError):
                  continue
              nodes[node_id] = (lon, lat)
              node_xml[node_id] = node

          way_shapes = {}
          way_tags = {}
          for way in root.findall('way'):
              try:
                  way_id = int(way.attrib['id'])
              except (KeyError, TypeError, ValueError):
                  continue
              coords = []
              for nd in way.findall('nd'):
                  try:
                      point = nodes.get(int(nd.attrib['ref']))
                  except (KeyError, TypeError, ValueError):
                      point = None
                  if point is not None:
                      coords.append(point)
              if len(coords) < 2:
                  continue
              if len(coords) >= 4 and coords[0] == coords[-1]:
                  shape = make_valid(Polygon(coords))
              else:
                  shape = LineString(coords)
              if shape.is_empty or not shape.intersects(envelope):
                  continue
              way_shapes[way_id] = shape
              way_tags[way_id] = tags_for(way)

          node_features = []
          for node_id, node in node_xml.items():
              tags = tags_for(node)
              if not tags:
                  continue
              point = Point(nodes[node_id])
              if point.intersects(envelope):
                  node_features.append({'type': 'node', 'id': node_id, 'tags': tags})

          way_features = [
              {'type': 'way', 'id': way_id, 'tags': tags}
              for way_id, tags in way_tags.items()
              if tags
          ]

          relation_features = []
          for relation in root.findall('relation'):
              tags = tags_for(relation)
              if not tags:
                  continue
              member_way_ids = []
              for member in relation.findall('member'):
                  if member.attrib.get('type') != 'way':
                      continue
                  try:
                      member_way_ids.append(int(member.attrib['ref']))
                  except (KeyError, TypeError, ValueError):
                      pass
              if not any(ref in way_shapes for ref in member_way_ids):
                  continue
              try:
                  relation_id = int(relation.attrib['id'])
              except (KeyError, TypeError, ValueError):
                  continue
              relation_features.append({'type': 'relation', 'id': relation_id, 'tags': tags})

          features = [*node_features, *way_features, *relation_features]
          retained = [f for f in features if f['type'] != 'node' and core.include_tags(f['tags'])]
          dropped = [f for f in features if f not in retained]

          keys = [
              'golf', 'highway', 'building', 'natural', 'landuse', 'waterway',
              'barrier', 'leisure', 'amenity', 'man_made', 'surface', 'tourism',
              'parking', 'service', 'tracktype', 'foot', 'access'
          ]

          def key_summary(items):
              output = {}
              for key in keys:
                  values = Counter(
                      str(item['tags'][key])
                      for item in items
                      if key in item['tags']
                  )
                  if values:
                      output[key] = {
                          'features': sum(values.values()),
                          'topValues': [
                              {'value': value, 'count': count}
                              for value, count in values.most_common(20)
                          ],
                      }
              return output

          examples = defaultdict(list)
          for item in dropped:
              for key in keys:
                  if key in item['tags'] and len(examples[key]) < 8:
                      examples[key].append({
                          'type': item['type'],
                          'id': item['id'],
                          'tags': item['tags'],
                      })

          report = {
              'course': config['courseName'],
              'courseElement': config['osmCourseElement'],
              'source': 'OpenStreetMap core /map endpoint; exact course-boundary intersection',
              'mapEndpoint': url,
              'boundaryBoundsLonLat': [round(v, 8) for v in boundary.bounds],
              'rawXmlCounts': {
                  'nodes': len(root.findall('node')),
                  'ways': len(root.findall('way')),
                  'relations': len(root.findall('relation')),
              },
              'taggedFeaturesInsideBoundary': {
                  'nodes': len(node_features),
                  'ways': len(way_features),
                  'relations': len(relation_features),
                  'total': len(features),
              },
              'currentImporterRetention': {
                  'retainedNonNodeFeatures': len(retained),
                  'droppedTaggedFeatures': len(dropped),
                  'retainedPctOfTagged': round(100 * len(retained) / len(features), 1) if features else 0,
                  'note': 'Current core importer drops all tagged nodes and only keeps golf plus narrow natural/landuse allow-lists.',
              },
              'allTaggedFeatureInventory': key_summary(features),
              'droppedFeatureInventory': key_summary(dropped),
              'droppedExamples': dict(examples),
          }

          out = Path('artifacts/course-geometry/arcadia-bluffs/full-osm-inventory-v1.json')
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Commit inventory
        run: |
          git add artifacts/course-geometry/arcadia-bluffs/full-osm-inventory-v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(course): inventory full Arcadia OSM map'
          git push origin HEAD:web-course-importer-surface-semantics-v2
