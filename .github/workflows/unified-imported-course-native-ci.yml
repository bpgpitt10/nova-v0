name: Unified Imported Course Native Checks

on:
  push:
    branches:
      - unified-imported-course-positioning-v1
    paths:
      - 'helpers/**'
      - 'tests/test_gspro_companion_waypoint.py'
      - '.github/workflows/unified-imported-course-native-ci.yml'

jobs:
  companion-unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only companion unit-test dependencies
        shell: pwsh
        run: python -m pip install opengolfcoach numpy opencv-python-headless
      - name: Run existing native companion contract and waypoint tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*companion*.py" -v
