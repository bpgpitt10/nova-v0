name: Web Alpha CI

on:
  push:
    branches:
      - web-alpha-mishits
      - farmlinks-ui-review-v1
      - web-course-e2e-preflight-v1
  pull_request:
    branches:
      - web-gspro-clean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test reviewed course tee metadata
        run: node tools/test-course-tee-metadata.mjs

      - name: Test progressive Live Caddie map framing
        run: node tools/test-live-caddie-map-framing.mjs

      - name: Validate canonical import registration
        run: node tools/check-canonical-imports.mjs

      - name: Build web app
        run: npm run build
