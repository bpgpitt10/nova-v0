name: Web Alpha CI

on:
  push:
    branches:
      - web-alpha-mishits
  pull_request:
    branches:
      - web-gspro-clean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
