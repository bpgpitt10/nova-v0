name: Web Alpha CI

on:
  push:
    branches:
      - web-alpha-mishits
      - auto-aim-windows-companion-v1
      - provisional-tee-live-fallback-v1
      - unified-imported-course-positioning-v1
      - production-live-caddie-consolidation-v1
      - live-caddie-partial-shot-integration-v1
      - live-caddie-production-readiness-v1
  pull_request:
    branches:
      - web-gspro-clean
      - web-alpha-mishits

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test read-only native aim preview against Greywolf fixtures
        run: npm run test:companion-preview

      - name: Test GSPro to OSM research-only landmark transform and existing hazard invariants
        run: node tools/test-gspro-course-landmark-registration.mjs

      - name: Test marker-only GSPro ball-waypoint-pin OSM diagnostics without hazard tagging
        run: node tools/test-gspro-marker-only-alignment.mjs

      - name: Test provisional missing tee fallback, native ruler input and locked-tee priority
        run: node tools/test-provisional-tee-live-fallback.mjs

      - name: Test FarmLinks physical GSPro world movement and round tee session isolation
        run: node tools/test-unified-gspro-world-projection.mjs

      - name: Test actual FarmLinks 572-yard stale tee overwrite regression
        run: node tools/test-live-first-tee-display.mjs

      - name: Test native one-shot wind/lie bridge from recorded FarmLinks 9mph SE capture
        run: node tools/test-one-shot-companion-wind.mjs

      - name: Test FarmLinks Deep Rough correction and ambiguous GSPro surface protection
        run: node tools/test-gspro-surface-fallback.mjs

      - name: Test hard tee-only Driver and Mini Driver rule in full recommender
        run: node tools/test-live-tee-only-club-rule.mjs

      - name: Test evidence-based GSPro numeric surface library and paired HUD observations
        run: node tools/test-gspro-surface-evidence-library.mjs

      - name: Validate production green LiDAR and auth integration contracts
        run: node tools/test-production-live-integration.mjs

      - name: Test homepage Live Caddie and same-course fresh round OCR gating
        run: node tools/test-live-caddie-round-restart-gate.mjs

      - name: Test under-range Shot Strategy, edge hazards and native-aim guardrails
        run: node tools/test-live-partial-shot-strategy.mjs

      - name: Green read (uphill-putt side, player-frame directions) and consistent partial-shot safe miss
        run: node tools/test-live-green-read.mjs

      - name: Native course positions (beta)
        run: node tools/test-native-course-positions.mjs

      - name: GSPro penalty log learning
        run: node tools/test-gspro-penalty-log.mjs

      - name: Live map matches GSPro minimap orientation
        run: node tools/test-minimap-frame.mjs

      - name: Map yardages (hazard reach/carry, green F/M/B)
        run: node tools/test-map-yardages.mjs

      - name: Live map hillshade
        run: node tools/test-hillshade.mjs

      - name: Green read (steepness, tilt, tiers, spines)
        run: node tools/test-green-read.mjs

      - name: Bag yardage book matches Club Detail (Stock/Pure, variants, mishit rate)
        run: node tools/test-bag-yardage-book.mjs

      - name: GSPro files through the Looper Companion (no folder grant)
        run: node tools/test-companion-gspro-files.mjs

      - name: Course loading matches GSPro course names to OpenStreetMap
        run: node tools/test-course-name-match.mjs

      - name: Shot 1 distance uses GSPro's round layout over the minimap ruler
        run: node tools/test-gspro-round-layout-distance.mjs

      - name: Outcome tiles add to 100 (off-map landings count as Trouble)
        run: node tools/test-outcome-tiles.mjs

      - name: Parallel club evaluation ranks exactly like one worker
        run: node tools/test-parallel-club-evaluation.mjs

      - name: Round history (Old Game rebuilds to 71, test sessions not scored)
        run: node tools/test-round-history.mjs

      - name: The Looper's Read follows the club's numbers
        run: node tools/test-looper-read.mjs

      - name: Course enrichment keeps islands and clearings
        run: |
          python3 -m pip install --quiet --break-system-packages numpy pytest || python3 -m pip install --quiet numpy pytest
          python3 -m pytest -q tests/test_enriched_package_holes.py

      - name: Browser registration fit (new courses)
        run: node tools/test-native-registration-fit.mjs

      - name: Aim click point at expected carry
        run: node tools/test-aim-click-point.mjs

      - name: GSPro distance beats a stale pin
        run: node tools/test-pin-reconcile.mjs

      - name: GSPro course links (Load page)
        run: node tools/test-gspro-links.mjs

      - name: GSPro penalty areas and OB from the course file
        run: node tools/test-gkd-hazards.mjs

      - name: OB as stroke and distance; OB clipped, safe and fast
        run: node tools/test-ob-stroke-distance.mjs

      - name: Green anchored to GSPro's green
        run: node tools/test-green-anchor.mjs

      - name: OSM holes mapped twice keep one copy
        run: |
          python3 -m pip install --quiet --break-system-packages shapely pytest || python3 -m pip install --quiet shapely pytest
          python3 -m pytest -q tests/test_osm_duplicate_holes.py

      - name: Per-club lay-up targets
        run: node tools/test-club-layup-target.mjs

      - name: Unmapped ground valued by landcover; next-state proofs
        run: node tools/test-next-state-unknown.mjs

      - name: Roll by surface and slope at touchdown
        run: node tools/test-roll-model.mjs

      - name: Descent meets the terrain (hill faces)
        run: node tools/test-descent-touchdown.mjs

      - name: Trees in the flight path
        run: node tools/test-flight-trees.mjs

      - name: Bag is range data only
        run: node tools/test-range-only-bag.mjs

      - name: Build web app
        run: npm run build
