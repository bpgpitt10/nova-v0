name: Apply conservative up/down lie prior

on:
  push:
    branches:
      - web-live-caddie-browser-visuals-v1
    paths:
      - tools/apply-updown-lie-prior.py
      - .github/workflows/apply-updown-lie-prior.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[updown-lie-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-live-caddie-browser-visuals-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply guarded up/down lie patch
        run: python tools/apply-updown-lie-prior.py
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Validate patch scope
        run: |
          git diff --check
          git diff --name-only HEAD -- \
            src/liveCaddie/lieResponse.ts \
            src/liveCaddie/shotContextModel.ts \
            src/liveCaddie/modelContract.ts \
            src/liveCaddie/aimOptimization.ts \
            src/pages/ConditionsMathPanel.tsx \
            src/pages/LiveCaddieWorker.ts
          test "$(git diff --name-only HEAD | grep -v '^tools/apply-updown-lie-prior.py$' | grep -v '^.github/workflows/apply-updown-lie-prior.yml$' | wc -l)" -eq 6
      - name: Commit validated model integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/liveCaddie/lieResponse.ts src/liveCaddie/shotContextModel.ts src/liveCaddie/modelContract.ts src/liveCaddie/aimOptimization.ts src/pages/ConditionsMathPanel.tsx src/pages/LiveCaddieWorker.ts
          git commit -m 'feat: model conservative up/down lie carry [updown-lie-applied]'
          git push origin HEAD:web-live-caddie-browser-visuals-v1
