name: Course E2E Preflight (No Imports)

on:
  push:
    branches:
      - web-course-e2e-preflight-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install geometry deps
        run: pip install -r requirements-course-geometry.txt
      - name: Test name matching without external requests
        run: python tools/test_discover_osm_course_by_name.py
      - name: Test request-to-config and failure receipts offline
        run: python tools/test_course_discovery_receipts.py
      - name: Test flexible course readiness without promoting unsupported tees
        run: python tools/test_course_flexible_readiness.py
      - name: Audit known FarmLinks and Valhalla evidence without rebuilding
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from audit_course_flexible_readiness import audit
          for slug in ('farmlinks','valhalla-golf-club'):
              pkg=json.loads(Path(f'public/course-geometry/{slug}/course-v1.json').read_text())
              base=Path(f'artifacts/course-geometry/{slug}')
              def receipt(name):
                  f=base/name
                  return json.loads(f.read_text()) if f.is_file() else None
              result=audit(pkg,map_receipt=receipt('map-ready-v1.json'),
                           runtime_receipt=receipt('runtime-ready-v1.json'))
              assert result['publicReady'] is False
              assert result['summary']['mappedHoles']==18
              expected=('existing_runtime_ready_not_scorecard_audited' if slug=='farmlinks'
                        else 'map_review_only_companion_calibration_candidate')
              assert result['mode']==expected, result['mode']
              print(slug, json.dumps({'mode':result['mode'], **result['summary']}))
          PY
      - name: Test durable importer machine clock
        run: python tools/test_course_import_timing.py
      - name: Regression test for WorldCover inner-hole masking
        run: python tools/test_course_landcover_masks.py
      - name: Tee points must never invent geometry or colors
        run: python tools/test_osm_tee_point_evidence.py
      - name: Validate map-only quality gate on a known reviewed course
        run: node tools/validate-course-map-contract.mjs --package public/course-geometry/farmlinks/course-v1.json --config config/course-geometry/farmlinks-v1.json
      - name: Test existing course contracts
        run: |
          node tools/test-course-tee-metadata.mjs
          node tools/test-live-caddie-map-framing.mjs
          node tools/check-canonical-imports.mjs
      - name: Test staged request API with mocked auth and GitHub
        run: node --test tests/course-request-api.test.mjs
      - name: App dependency installation
        run: npm ci
      - name: Validate GSPro-to-OSM landmark research proof, no native input
        run: node tools/test-gspro-course-landmark-registration.mjs
      - name: Protect original Python V7 hazard/woods promotion on imported packages
        run: python tools/test_course_surface_semantics_v7.py
      - name: Build (no network course import)
        run: npm run build
