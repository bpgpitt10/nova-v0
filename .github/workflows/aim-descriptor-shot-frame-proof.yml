name: Aim descriptor shot-frame proof

on:
  push:
    branches:
      - aim-descriptor-shot-frame-v1
    paths:
      - 'src/liveCaddie/aimDescriptor*.ts'
      - '.github/workflows/aim-descriptor-shot-frame-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run deterministic descriptor scenarios
        run: npx --yes tsx -e "import { runAimDescriptorShotFrameProof } from './src/liveCaddie/aimDescriptorFrameProof.ts'; if (!runAimDescriptorShotFrameProof()) process.exit(1); console.log('Aim descriptor shot-frame proof PASS')"
