name: Tobacco Road OSM course package

on:
  push:
    branches:
      - course-geometry-tactical-v0
    paths:
      - config/course-geometry/tobacco-road-v1.json
      - tools/build_osm_course_package.py
      - .github/workflows/tobacco-road-osm-package.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-course-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-geometry-tactical-v0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write bounded Overpass query
        shell: bash
        run: |
          cat > /tmp/tobacco-road.overpassql <<'QUERY'
          [out:json][timeout:120];
          way(430227508);
          map_to_area -> .courseArea;
          (
            nwr(area.courseArea)["golf"];
            nwr(area.courseArea)["natural"~"^(wood|scrub|water)$"];
            nwr(area.courseArea)["landuse"~"^(forest|grass|meadow|reservoir)$"];
          );
          out body geom;
          QUERY

      - name: Fetch and preserve OpenStreetMap snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/course-geometry/tobacco-road
          user_agent='LooperCoursePackage/0.1 (+https://github.com/bpgpitt10/nova-v0)'
          success=0
          for endpoint in \
            'https://overpass-api.de/api/interpreter' \
            'https://overpass.kumi.systems/api/interpreter'; do
            echo "Querying ${endpoint}"
            if curl -A "$user_agent" -L --fail --retry 2 --retry-delay 3 \
              --data-urlencode 'data@/tmp/tobacco-road.overpassql' \
              "$endpoint" \
              -o artifacts/course-geometry/tobacco-road/osm-snapshot.json; then
              success=1
              break
            fi
          done
          test "$success" -eq 1
          cp /tmp/tobacco-road.overpassql artifacts/course-geometry/tobacco-road/overpass-query.txt
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/course-geometry/tobacco-road/osm-snapshot.json')
          payload = json.loads(path.read_text())
          elements = payload.get('elements') or []
          holes = [e for e in elements if (e.get('tags') or {}).get('golf') == 'hole']
          print({'elements': len(elements), 'golf_hole_elements': len(holes), 'osm3s': payload.get('osm3s')})
          if len(elements) < 50:
              raise SystemExit('OSM snapshot unexpectedly small')
          PY

      - name: Build static browser package and validation manifest
        shell: bash
        run: |
          mkdir -p public/course-geometry/tobacco-road
          python tools/build_osm_course_package.py \
            --osm artifacts/course-geometry/tobacco-road/osm-snapshot.json \
            --config config/course-geometry/tobacco-road-v1.json \
            --output public/course-geometry/tobacco-road/course-v1.json \
            --manifest artifacts/course-geometry/tobacco-road/validation-v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('artifacts/course-geometry/tobacco-road/validation-v1.json').read_text())
          assert manifest['osmHoleRoutes'] == 18, manifest['osmHoleRoutes']
          assert manifest['readyHoleCount'] == 18, manifest['readyHoles']
          assert manifest['allHolesStaticGeometryReady'] is True
          print(json.dumps(manifest, indent=2))
          PY

      - name: Persist cached course package and source proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/course-geometry/tobacco-road/course-v1.json \
            artifacts/course-geometry/tobacco-road/osm-snapshot.json \
            artifacts/course-geometry/tobacco-road/overpass-query.txt \
            artifacts/course-geometry/tobacco-road/validation-v1.json
          if git diff --cached --quiet; then
            echo "Tobacco Road course package unchanged"
          else
            git commit -m "Build Tobacco Road cached OSM course package"
            git fetch origin course-geometry-tactical-v0
            git rebase origin/course-geometry-tactical-v0
            git push origin HEAD:course-geometry-tactical-v0
          fi

      - name: Upload validation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tobacco-road-course-package-proof
          path: |
            artifacts/course-geometry/tobacco-road/validation-v1.json
            artifacts/course-geometry/tobacco-road/overpass-query.txt
          if-no-files-found: ignore
          retention-days: 14
