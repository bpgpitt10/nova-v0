name: Arcadia Links Landcover Upgrade

on:
  push:
    branches:
      - course-importer-surface-semantics-v1
    paths:
      - '.github/workflows/arcadia-links-landcover-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout canonical importer branch
        uses: actions/checkout@v4
        with:
          ref: course-importer-surface-semantics-v1
          fetch-depth: 0

      - name: Patch links-style landcover semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # The core-map snapshotter previously discarded the landcover that
          # defines links courses before the compiler ever saw it.
          replace_once(
              'tools/fetch_osm_course_snapshot_core.py',
              'NATURAL_VALUES = {"wood", "scrub", "water"}',
              'NATURAL_VALUES = {"wood", "scrub", "water", "grassland", "heath", "sand", "beach"}',
          )

          # Keep the Overpass fallback aligned with the canonical core provider.
          replace_once(
              'tools/fetch_osm_course_snapshot.py',
              '["natural"~"^(wood|scrub|water)$"]',
              '["natural"~"^(wood|scrub|water|grassland|heath|sand|beach)$"]',
          )

          # Extend the canonical classifier without changing legacy compiler
          # behavior outside the canonical rebuild path.
          replace_once(
              'tools/build_osm_course_package_canonical.py',
              '    base.normalize_osm = v6.normalize_osm\n    v4.model_for_hole = v7.model_for_hole',
              '''    base.CONTEXT_NATURAL.update({\n        "grassland": "native-grass",\n        "heath": "scrub",\n        "sand": "dune-sand",\n        "beach": "dune-sand",\n    })\n    base.CONTEXT_LANDUSE["meadow"] = "native-grass"\n    base.normalize_osm = v6.normalize_osm\n    v4.model_for_hole = v7.model_for_hole''',
          )

          # Native grass is tactically difficult vegetation, but its original
          # context identity remains available to the renderer. Dune sand stays
          # context-only and is not silently converted into a bunker/penalty.
          replace_once(
              'tools/build_osm_course_package_v7.py',
              'TACTICAL_CONTEXT_KINDS = ("woods", "scrub")',
              'TACTICAL_CONTEXT_KINDS = ("woods", "scrub", "native-grass")',
          )
          replace_once(
              'tools/build_osm_course_package_v7.py',
              '"contextPromotedToDeepRough": list(TACTICAL_CONTEXT_KINDS),',
              '"contextPromotedToDeepRough": list(TACTICAL_CONTEXT_KINDS),',
          )
          replace_once(
              'tools/build_osm_course_package_v7.py',
              '"woods/scrub are preserved and mirrored as deep-rough; runtime precedence "',
              '"woods/scrub/native grass are preserved and mirrored as deep-rough; runtime precedence "',
          )

          # Runtime loader must preserve the new context classes instead of
          # dropping them as unknown package fields.
          replace_once(
              'src/courseGeometry/types.ts',
              "export type CourseContextKind = 'woods' | 'scrub' | 'grass-context'",
              "export type CourseContextKind = 'woods' | 'scrub' | 'grass-context' | 'native-grass' | 'dune-sand'",
          )
          replace_once(
              'src/courseGeometry/routePackagedCourseLoader.ts',
              "const CONTEXT_KINDS: readonly CourseContextKind[] = ['woods', 'scrub', 'grass-context']",
              "const CONTEXT_KINDS: readonly CourseContextKind[] = ['woods', 'scrub', 'grass-context', 'native-grass', 'dune-sand']",
          )

          # Give Arcadia-style landcover its own visual language. Deep-rough is
          # translucent so the source context remains legible underneath it.
          replace_once(
              'src/pages/LiveCaddiePage.css',
              '''.live-context.context-grass-context {\n  fill: rgba(122, 142, 73, 0.07);\n  stroke: none;\n}\n\n.live-context.context-woods {''',
              '''.live-context.context-grass-context {\n  fill: rgba(122, 142, 73, 0.07);\n  stroke: none;\n}\n\n.live-context.context-native-grass {\n  fill: rgba(153, 139, 70, 0.30);\n  stroke: rgba(205, 190, 105, 0.42);\n  stroke-width: 0.11;\n  stroke-dasharray: 0.34 0.22;\n}\n\n.live-context.context-dune-sand {\n  fill: rgba(181, 153, 99, 0.34);\n  stroke: rgba(224, 197, 137, 0.44);\n  stroke-width: 0.11;\n}\n\n.live-context.context-woods {''',
          )
          replace_once(
              'src/pages/LiveCaddiePage.css',
              '.live-map .surface-deep-rough { fill: #19301e; stroke: #315437; }',
              '.live-map .surface-deep-rough { fill: rgba(25, 48, 30, 0.46); stroke: #315437; }',
          )
          PY

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geometry dependencies
        run: pip install -r requirements-course-geometry.txt

      - name: Preserve current Arcadia terrain package
        run: |
          mkdir -p /tmp/looper-arcadia-links artifacts/course-geometry/arcadia-bluffs public/course-geometry/arcadia-bluffs
          cp public/course-geometry/arcadia-bluffs/course-v1.json /tmp/looper-arcadia-links/old-package.json

      - name: Fetch fresh Arcadia snapshot with links landcover
        run: |
          python tools/fetch_osm_course_snapshot_core.py \
            --config config/course-geometry/arcadia-bluffs-v1.json \
            --output artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json

      - name: Rebuild Arcadia canonical geometry
        run: |
          python tools/diagnose_course_route_orientation.py \
            --osm artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json
          python tools/build_osm_course_package_canonical.py \
            --osm artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json \
            --config config/course-geometry/arcadia-bluffs-v1.json \
            --output /tmp/looper-arcadia-links/geometry.json \
            --manifest artifacts/course-geometry/arcadia-bluffs/validation-v1.json
          python tools/carry_forward_embedded_terrain.py \
            --old-package /tmp/looper-arcadia-links/old-package.json \
            --new-package /tmp/looper-arcadia-links/geometry.json \
            --output public/course-geometry/arcadia-bluffs/course-v1.json
          python tools/update_course_cache_after_rebuild.py \
            --cache artifacts/course-geometry/arcadia-bluffs/cache-v1.json \
            --config config/course-geometry/arcadia-bluffs-v1.json \
            --snapshot artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json \
            --package public/course-geometry/arcadia-bluffs/course-v1.json \
            --manifest artifacts/course-geometry/arcadia-bluffs/validation-v1.json

      - name: Write landcover audit
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          snapshot_path = Path('artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json')
          package_path = Path('public/course-geometry/arcadia-bluffs/course-v1.json')
          snapshot = json.loads(snapshot_path.read_text())
          package = json.loads(package_path.read_text())

          tags = Counter()
          for element in snapshot.get('elements', []):
              t = element.get('tags') or {}
              for key in ('golf', 'natural', 'landuse'):
                  if t.get(key):
                      tags[f'{key}={t[key]}'] += 1

          holes = {}
          for hole_no, hole in sorted((package.get('holes') or {}).items(), key=lambda item: int(item[0])):
              context = hole.get('context') or {}
              surfaces = hole.get('surfaces') or {}
              holes[hole_no] = {
                  'contextPolygons': {kind: len(polygons) for kind, polygons in sorted(context.items()) if isinstance(polygons, list)},
                  'deepRoughPolygons': len(surfaces.get('deep-rough') or []),
              }

          audit = {
              'sourceTagCounts': dict(sorted(tags.items())),
              'holes': holes,
          }
          out = Path('artifacts/course-geometry/arcadia-bluffs/landcover-summary-v1.json')
          out.write_text(json.dumps(audit, indent=2, sort_keys=True) + '\n')
          print('Arcadia Hole 9 landcover:')
          print(json.dumps(holes.get('9'), indent=2, sort_keys=True))
          print('Relevant source tags:')
          print(json.dumps({k: v for k, v in audit['sourceTagCounts'].items() if any(term in k for term in ('grassland', 'heath', 'sand', 'beach', 'scrub', 'meadow'))}, indent=2, sort_keys=True))
          PY

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate runtime
        run: |
          npm ci
          npm run build
          npm run courses:audit-runtime -- --strict --candidate arcadia-bluffs

      - name: Commit importer, renderer, and Arcadia rebuild
        run: |
          git add \
            tools/fetch_osm_course_snapshot_core.py \
            tools/fetch_osm_course_snapshot.py \
            tools/build_osm_course_package_canonical.py \
            tools/build_osm_course_package_v7.py \
            src/courseGeometry/types.ts \
            src/courseGeometry/routePackagedCourseLoader.ts \
            src/pages/LiveCaddiePage.css \
            artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json \
            artifacts/course-geometry/arcadia-bluffs/validation-v1.json \
            artifacts/course-geometry/arcadia-bluffs/cache-v1.json \
            artifacts/course-geometry/arcadia-bluffs/landcover-summary-v1.json \
            public/course-geometry/arcadia-bluffs/course-v1.json \
            src/courseGeometry/generatedRouteHoleHeadings.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(course): preserve links landcover semantics'
          git push origin HEAD:course-importer-surface-semantics-v1
