name: Oakmont H10 Terrain Diagnostic

on:
  push:
    branches:
      - web-course-importer-surface-semantics-v1
    paths:
      - .github/workflows/oakmont-h10-terrain-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sample H10 terrain corridor
        run: |
          python - <<'PY'
          import base64, json, struct, zlib
          from pathlib import Path

          package = json.loads(Path('public/course-geometry/oakmont-country-club/course-v1.json').read_text())
          hole = package['holes']['10']
          terrain = hole['terrain']
          min_x = float(terrain['minX'])
          min_y = float(terrain['minY'])
          spacing = float(terrain['runtimeSpacingYds'])
          width = int(terrain['width'])
          height = int(terrain['height'])
          offset = float(terrain['elevationOffsetFt'])
          nodata = int(terrain['nodata'])
          raw = zlib.decompress(base64.b64decode(terrain['valuesBase64']))
          values = struct.unpack('<' + 'H' * (len(raw)//2), raw)
          assert len(values) == width * height

          def cell(ix, iy):
              if ix < 0 or iy < 0 or ix >= width or iy >= height:
                  return None
              q = values[iy * width + ix]
              return None if q == nodata else offset + q / 10.0

          def nearest(x, y):
              ix = round((x - min_x) / spacing)
              iy = round((y - min_y) / spacing)
              return cell(ix, iy)

          print('coordinateFrame=', json.dumps(hole.get('coordinateFrame', {}), sort_keys=True))
          print('referenceYards=', hole.get('referenceYards'))
          print('terrainGrid=', json.dumps({
              'minX': min_x, 'minY': min_y, 'spacing': spacing,
              'width': width, 'height': height,
              'elevationOffsetFt': offset,
          }, sort_keys=True))

          # 2-D absolute elevations around the restored-ravine zone.
          xs = list(range(-80, 81, 10))
          print('MATRIX_X=', xs)
          for y in range(270, 381, 10):
              zs = [nearest(x, y) for x in xs]
              print('MATRIX', y, [None if z is None else round(z, 1) for z in zs])

          # Remove each row's median-ish center value so a diagonal low trough is
          # easier to spot. Negative numbers are locally low relative to x=0.
          print('RELATIVE_TO_CENTER_BEGIN')
          for y in range(270, 381, 10):
              center = nearest(0, y)
              row = []
              for x in xs:
                  z = nearest(x, y)
                  row.append(None if z is None or center is None else round(z-center, 1))
              finite = [(delta, x) for delta, x in zip(row, xs) if delta is not None]
              low = min(finite) if finite else None
              print('REL', y, row, 'LOW', low)
          print('RELATIVE_TO_CENTER_END')

          # For each Y, report the lowest point across the corridor. A diagonal
          # ravine should show the low-X location migrating across Y rather than a
          # fixed side slope.
          print('LOW_PATH_BEGIN')
          for y in range(250, 401, 5):
              samples = [(nearest(x, y), x) for x in range(-80, 81, 5)]
              samples = [(z, x) for z, x in samples if z is not None]
              if samples:
                  z, x = min(samples)
                  center = nearest(0, y)
                  print(json.dumps({
                      'y': y,
                      'lowX': x,
                      'lowFt': round(z, 1),
                      'centerFt': None if center is None else round(center, 1),
                      'lowVsCenterFt': None if center is None else round(z-center, 1),
                  }))
          print('LOW_PATH_END')
          PY
