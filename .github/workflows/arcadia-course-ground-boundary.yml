name: Arcadia Course Ground Boundary Fix

on:
  push:
    branches:
      - web-course-importer-surface-semantics-v2
    paths:
      - '.github/workflows/arcadia-course-ground-boundary.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: web-course-importer-surface-semantics-v2
          fetch-depth: 0

      - name: Patch fallback to full course boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/build_osm_course_package_v5.py')
          text = p.read_text(encoding='utf-8')
          old = '''        fallback_polygons = feature_intersections_rebased(\n            by_kind.get("course-boundary", []), context_corridor,\n            route_origin, forward, right, anchor_offset, simplify_yards,\n        )'''
          new = '''        fallback_polygons: list[list[list[float]]] = []\n        for feature in by_kind.get("course-boundary", []):\n            for polygon in feature_polygons_rebased(\n                feature, route_origin, forward, right, anchor_offset\n            ):\n                fallback_polygons.extend(v4.serialize_shape(polygon, simplify_yards))'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one fallback corridor block; found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geometry dependencies
        run: pip install -r requirements-course-geometry.txt

      - name: Preserve current Arcadia terrain
        run: |
          mkdir -p /tmp/arcadia-boundary
          cp public/course-geometry/arcadia-bluffs/course-v1.json /tmp/arcadia-boundary/old-package.json

      - name: Rebuild Arcadia only
        run: |
          python tools/build_osm_course_package_canonical.py \
            --osm artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json \
            --config config/course-geometry/arcadia-bluffs-v1.json \
            --output /tmp/arcadia-boundary/geometry.json \
            --manifest artifacts/course-geometry/arcadia-bluffs/validation-v1.json
          python tools/carry_forward_embedded_terrain.py \
            --old-package /tmp/arcadia-boundary/old-package.json \
            --new-package /tmp/arcadia-boundary/geometry.json \
            --output public/course-geometry/arcadia-bluffs/course-v1.json
          python tools/update_course_cache_after_rebuild.py \
            --cache artifacts/course-geometry/arcadia-bluffs/cache-v1.json \
            --config config/course-geometry/arcadia-bluffs-v1.json \
            --snapshot artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json \
            --package public/course-geometry/arcadia-bluffs/course-v1.json \
            --manifest artifacts/course-geometry/arcadia-bluffs/validation-v1.json

      - name: Validate holes 2 and 9 fallback
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(Path('public/course-geometry/arcadia-bluffs/course-v1.json').read_text())
          result = {}
          for hole_no in ('2', '9'):
              hole = package['holes'][hole_no]
              context = hole.get('context') or {}
              polys = context.get('native-ground') or []
              if not polys:
                  raise SystemExit(f'Hole {hole_no} lost native-ground context')
              xs = [p[0] for poly in polys for p in poly]
              ys = [p[1] for poly in polys for p in poly]
              result[hole_no] = {
                  'nativeGroundPolygons': len(polys),
                  'bounds': {
                      'minX': round(min(xs), 1), 'maxX': round(max(xs), 1),
                      'minY': round(min(ys), 1), 'maxY': round(max(ys), 1),
                  },
                  'viewBounds': hole.get('viewBounds'),
              }
          Path('artifacts/course-geometry/arcadia-bluffs/course-ground-boundary-audit-v1.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate runtime
        run: |
          npm ci
          npm run build
          npm run courses:audit-runtime -- --strict --candidate arcadia-bluffs

      - name: Commit Arcadia boundary-ground fix
        run: |
          git add \
            tools/build_osm_course_package_v5.py \
            artifacts/course-geometry/arcadia-bluffs/validation-v1.json \
            artifacts/course-geometry/arcadia-bluffs/cache-v1.json \
            artifacts/course-geometry/arcadia-bluffs/course-ground-boundary-audit-v1.json \
            public/course-geometry/arcadia-bluffs/course-v1.json \
            src/courseGeometry/generatedRouteHoleHeadings.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(course): render Arcadia ground to course boundary'
          git push origin HEAD:web-course-importer-surface-semantics-v2
