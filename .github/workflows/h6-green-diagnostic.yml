name: Diagnose Greywolf Hole 6 green

on:
  push:
    branches:
      - exact-pin-outputlog-v1
    paths:
      - 'tools/diagnose_h6_green.py'
      - 'tools/audit_green_local_planes.py'
      - 'public/course-geometry/greywolf/green-detail-v1.json'
      - 'public/course-geometry/greywolf/local-geometry/**'
      - '.github/workflows/h6-green-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exact-pin-outputlog-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose Hole 6 only
        run: python tools/diagnose_h6_green.py
      - name: Audit green-clipped local planes on Hole 6
        run: python tools/audit_green_local_planes.py --hole 6
      - name: Audit green-clipped local planes on all 18
        run: python tools/audit_green_local_planes.py
