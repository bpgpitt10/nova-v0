name: Wire Greywolf Aim Lab terrain

on:
  push:
    branches:
      - course-geometry-tactical-v0
    paths:
      - .github/workflows/wire-greywolf-aimlab-terrain.yml

permissions:
  contents: write

jobs:
  patch-aim-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-geometry-tactical-v0

      - name: Replace Hole 1 terrain guard with loaded-hole terrain
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/dev/AimLabPage.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "import { estimateGreywolfHole01Terrain } from '../courseGeometry/lidar'",
                  "import { estimateGreywolfTerrain } from '../courseGeometry/lidar'",
              ),
              (
                  "  const ballTerrain = holeNumber === 1 ? estimateGreywolfHole01Terrain(ball) : null\n"
                  "  const targetTerrain = holeNumber === 1 ? estimateGreywolfHole01Terrain(target) : null",
                  "  const ballTerrain = hole ? estimateGreywolfTerrain(hole, ball) : null\n"
                  "  const targetTerrain = hole ? estimateGreywolfTerrain(hole, target) : null",
              ),
              (
                  "          elevationSource: holeNumber === 1 ? 'Greywolf H1 LiDAR contour proxy' : 'No elevation model for this hole yet',",
                  "          elevationSource: ballTerrain && targetTerrain\n"
                  "            ? ballTerrain.source === 'lidar-dem' && targetTerrain.source === 'lidar-dem'\n"
                  "              ? 'Greywolf direct 1 m LiDAR DEM'\n"
                  "              : 'Greywolf LiDAR contour proxy'\n"
                  "            : 'No elevation model for this hole yet',",
              ),
          ]

          for before, after in replacements:
              if before not in text:
                  raise SystemExit(f'Expected Aim Lab source block not found: {before[:80]}')
              text = text.replace(before, after, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit one-time wiring change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wire-greywolf-aimlab-terrain.yml
          git add src/dev/AimLabPage.tsx
          git commit -m "Use course-wide LiDAR terrain in Aim Lab"
          git fetch origin course-geometry-tactical-v0
          git rebase origin/course-geometry-tactical-v0
          git push origin HEAD:course-geometry-tactical-v0
