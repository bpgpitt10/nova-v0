name: Canada DEM smoke (temporary)

# Branch-only check that the loader's Canadian path works against the real
# services before merging: find Cabot Cliffs, read NRCan HRDEM DTM onto the
# UTM grid, build the canopy model from DSM - DTM. Nothing is committed.
on:
  push:
    branches:
      - loader-canada-hrdem-v1

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements-course-geometry.txt numpy scipy scikit-image matplotlib affine 'laspy[lazrs]'
      - name: Find Cabot Cliffs (USGS LiDAR absent -> NRCan HRDEM)
        run: |
          python tools/course_model/find_course.py --name-regex Cabot --lat 46.2487 --lon -61.2921 \
            --radius-m 8000 --osm-id 676091202 --out .tmp/smoke/model
          python - <<'PY'
          import json; b = json.load(open('.tmp/smoke/model/course-bbox.json'))
          print(json.dumps({k: b.get(k) for k in ('crs', 'demProvider')}), json.dumps(b.get('hrdem'), indent=1)[:1500])
          PY
      - name: 1 m DEM from HRDEM
        run: |
          crs=$(python -c "import json;print(json.load(open('.tmp/smoke/model/course-bbox.json'))['crs'])")
          python tools/course_model/fetch_sources.py dem --dem-source .tmp/smoke/model/course-bbox.json --crs "$crs" --tmp .tmp/smoke/tmp --out .tmp/smoke/model
      - name: Canopy heights from HRDEM DSM - DTM
        run: python tools/course_model/fetch_sources.py chm --dem-source .tmp/smoke/model/course-bbox.json --dem .tmp/smoke/model/dem-utm-1m.json --out .tmp/smoke/model
      - name: Trees
        run: |
          python tools/course_model/fetch_sources.py osm --dem-source .tmp/smoke/model/course-bbox.json --out .tmp/smoke/model
          python tools/course_model/build_trees.py --chm .tmp/smoke/model/chm-utm-1m.json --osm .tmp/smoke/model/osm-full.json.gz --out .tmp/smoke/model
          cat .tmp/smoke/model/trees-summary.json | head -c 1500
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canada-dem-smoke
          path: |
            .tmp/smoke/model/*.json
          retention-days: 3
