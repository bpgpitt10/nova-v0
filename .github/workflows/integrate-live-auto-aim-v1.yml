name: Integrate Live Auto Aim V1

on:
  push:
    branches:
      - live-caddie-auto-aim-v1

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-caddie-auto-aim-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply Auto Aim integration patch
        run: python scripts/apply_auto_aim_integration.py

      - name: Install web dependencies
        run: npm ci

      - name: Generate runtime course artifacts
        shell: pwsh
        run: |
          npm run courses:generate-runtime-registry
          npm run courses:generate-registration

      - name: Check TypeScript
        run: npx tsc -b

      - name: Build Vite app
        run: npx vite build

      - name: Build existing Windows helper sidecar
        run: npm run helper:build:windows

      - name: Check Tauri Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Commit integrated Auto Aim
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'No integration changes required.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/main.rs src/pages/LiveCaddiePage.tsx
          git commit -m 'Wire verified Auto Aim into Live Caddie'
          git push origin HEAD:live-caddie-auto-aim-v1
