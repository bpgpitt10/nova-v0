name: Planned OSM course acceptance batch

on:
  push:
    branches:
      - course-importer-cache-v1
    paths:
      - config/course-import-seeds/**
      - tools/batch_prepare_osm_courses.py
      - tools/recover_course_discovery_from_location.py
      - tools/apply_course_terrain_defaults.py
      - .github/workflows/osm-course-batch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osm-course-batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-planned-courses:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install course importer dependencies
        run: pip install -r tools/requirements-course-importer.txt

      - name: Discover, prepare, and time planned courses
        id: prepare
        continue-on-error: true
        run: |
          python tools/batch_prepare_osm_courses.py \
            --seed-file config/course-import-seeds/planned-courses-v1.json

      - name: Revalidate and recover location-anchor identities
        run: |
          python tools/recover_course_discovery_from_location.py \
            --seed-file config/course-import-seeds/planned-courses-v1.json

      - name: Re-import only identity-recovered courses
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t recovered_slugs < <(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/course-geometry/location-anchor-recovery-v1.json')
          payload = json.loads(path.read_text()) if path.exists() else {}
          for row in payload.get('results') or []:
              if row.get('status') == 'recovered' and row.get('slug'):
                  print(row['slug'])
          PY
          )
          if [ "${#recovered_slugs[@]}" -eq 0 ]; then
            echo "No course identities recovered; no targeted re-import needed"
            exit 0
          fi
          for slug in "${recovered_slugs[@]}"; do
            echo "=== Re-importing identity-verified course: $slug ==="
            python tools/timed_import_osm_course.py \
              --config "config/course-geometry/$slug-v1.json"
          done

      - name: Record declared unsupported OSM courses
        if: always()
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          seed_path = Path('config/course-import-seeds/planned-courses-v1.json')
          payload = json.loads(seed_path.read_text())
          active = payload.get('courses') or []
          unsupported = payload.get('unsupportedCourses') or []
          if not isinstance(active, list) or not isinstance(unsupported, list):
              raise SystemExit('planned course seed registry must use array courses/unsupportedCourses')

          active_ids = {row.get('courseId') for row in active if isinstance(row, dict)}
          active_slugs = {row.get('slug') for row in active if isinstance(row, dict)}
          rows = []
          for row in unsupported:
              if not isinstance(row, dict):
                  raise SystemExit('unsupportedCourses entries must be objects')
              for key in ('courseId', 'courseName', 'location', 'slug', 'status', 'reason'):
                  if not row.get(key):
                      raise SystemExit(f'unsupported OSM course missing {key}: {row}')
              if row['status'] != 'unsupported-osm':
                  raise SystemExit(f"unsupported course {row['courseId']} has invalid status {row['status']!r}")
              if row['courseId'] in active_ids or row['slug'] in active_slugs:
                  raise SystemExit(f"unsupported course overlaps active course registry: {row['courseId']}")
              evidence = row.get('evidence')
              if not isinstance(evidence, dict):
                  raise SystemExit(f"unsupported course {row['courseId']} requires evidence")
              rows.append(row)

          summary = {
              'schemaVersion': 'looper-unsupported-osm-v1',
              'generatedAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'count': len(rows),
              'courses': rows,
          }
          out = Path('artifacts/course-geometry/unsupported-osm-v1.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Apply generic terrain defaults
        if: always()
        run: |
          python tools/apply_course_terrain_defaults.py \
            --seed-file config/course-import-seeds/planned-courses-v1.json

      - name: Persist generated configs, caches, packages, and timing history
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/course-geometry artifacts/course-geometry public/course-geometry
          if git diff --cached --quiet; then
            echo "Batch produced no repository changes"
            exit 0
          fi

          branch="${GITHUB_REF_NAME}"
          git commit -m "Prepare planned OSM course batch"
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git push origin "HEAD:$branch"

      - name: Upload batch discovery and validation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-course-batch-proof-${{ github.run_id }}
          path: |
            artifacts/course-geometry/batch-planned-courses-v1.json
            artifacts/course-geometry/location-anchor-recovery-v1.json
            artifacts/course-geometry/unsupported-osm-v1.json
            artifacts/course-geometry/**/discovery-v1.json
            artifacts/course-geometry/**/prepare-timings.ndjson
            artifacts/course-geometry/**/import-timings.ndjson
            artifacts/course-geometry/**/validation-v1.json
            artifacts/course-geometry/**/cache-v1.json
            artifacts/course-geometry/**/topology-audit-v1.json
            public/course-geometry/**/course-v1.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce batch acceptance result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          unsupported_path = Path('artifacts/course-geometry/unsupported-osm-v1.json')
          if not unsupported_path.exists():
              raise SystemExit('Unsupported-OSM registry proof did not produce a summary')
          unsupported = json.loads(unsupported_path.read_text())
          print(json.dumps(unsupported, indent=2))

          recovery_path = Path('artifacts/course-geometry/location-anchor-recovery-v1.json')
          if not recovery_path.exists():
              raise SystemExit('Location-anchor identity recovery did not produce a summary')
          recovery = json.loads(recovery_path.read_text())
          identity_failures = [
              row.get('courseId')
              for row in recovery.get('results') or []
              if row.get('status') == 'failed'
          ]
          if identity_failures:
              raise SystemExit(f'Identity-safe course discovery failures: {identity_failures}')

          path = Path('artifacts/course-geometry/batch-planned-courses-v1.json')
          if not path.exists():
              raise SystemExit('Batch preparation did not produce a summary')
          summary = json.loads(path.read_text())
          print(json.dumps(summary, indent=2))
          failures = summary.get('failedCourseIds') or []
          if failures:
              raise SystemExit(f'Planned-course acceptance failures: {failures}')
          PY
