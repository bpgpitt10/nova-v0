name: Course render dev build

on:
  push:
    branches:
      - course-render-greywolf-h1-v0
      - course-geometry-tactical-v0
    paths:
      - src/courseGeometry/**
      - src/liveCaddie/**
      - src/dev/CourseRenderDevPage.tsx
      - src/dev/courseRenderDev.css
      - src/dev/greywolfHole01RenderFixture.ts
      - src/dev/CourseGeometryDevPage.tsx
      - src/dev/courseGeometryDev.css
      - src/dev/AimLabPage.tsx
      - src/dev/aimLab.css
      - src/dev/CaddieInputsPage.tsx
      - src/dev/caddieInputs.css
      - config/course-geometry/**
      - public/course-geometry/**
      - artifacts/course-geometry/**
      - tools/build_osm_course_package.py
      - tools/build_osm_course_package_v2.py
      - tools/gspro_physics_lab.py
      - tools/validate-course-runtime.mjs
      - src/main.tsx
      - .github/workflows/course-render-dev-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node tools/validate-course-runtime.mjs
      - run: npm run build
      - run: python -m py_compile tools/build_osm_course_package.py tools/build_osm_course_package_v2.py tools/gspro_physics_lab.py
