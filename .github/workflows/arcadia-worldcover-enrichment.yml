name: Arcadia WorldCover Enrichment

on:
  push:
    branches:
      - web-course-importer-surface-semantics-v2
    paths:
      - '.github/workflows/arcadia-worldcover-enrichment.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: web-course-importer-surface-semantics-v2
          fetch-depth: 0

      - name: Wire WorldCover context semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          config_path = Path('config/course-geometry/arcadia-bluffs-v1.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          selection = config.get('selection') or {}
          selection.pop('courseGroundFallbackContextKind', None)
          config['selection'] = selection
          config_path.write_text(json.dumps(config, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          replace_once(
              'tools/build_osm_course_package_v4.py',
              'CONTEXT_KINDS = ("woods", "scrub", "grass-context", "native-grass", "dune-sand", "native-ground")',
              'CONTEXT_KINDS = ("woods", "scrub", "grass-context", "native-grass", "dune-sand")',
          )

          replace_once(
              'src/courseGeometry/types.ts',
              "export type CourseContextKind = 'woods' | 'scrub' | 'grass-context' | 'native-grass' | 'dune-sand' | 'native-ground'",
              "export type CourseContextKind = 'woods' | 'scrub' | 'grass-context' | 'native-grass' | 'dune-sand' | 'landcover-grass' | 'landcover-woods' | 'landcover-scrub' | 'landcover-bare'",
          )

          replace_once(
              'src/courseGeometry/routePackagedCourseLoader.ts',
              "const CONTEXT_KINDS: readonly CourseContextKind[] = ['woods', 'scrub', 'grass-context', 'native-grass', 'dune-sand', 'native-ground']",
              "const CONTEXT_KINDS: readonly CourseContextKind[] = ['woods', 'scrub', 'grass-context', 'native-grass', 'dune-sand', 'landcover-grass', 'landcover-woods', 'landcover-scrub', 'landcover-bare']",
          )

          replace_once(
              'src/courseGeometry/routePackagedCourseLoader.ts',
              '''    return [{\n      id: `${courseId}-h${String(holeNumber).padStart(2, '0')}-${kind}`,\n      kind,\n      polygons,\n      provenance: {\n        source: 'osm',\n        sourceFeature: `cached OSM ${kind} context`,\n        confidence: 'high',\n        note: 'Compiled from the cached OSM golf=hole route package.',\n      },\n    }]''',
              '''    const isWorldCover = kind.startsWith('landcover-')\n    return [{\n      id: `${courseId}-h${String(holeNumber).padStart(2, '0')}-${kind}`,\n      kind,\n      polygons,\n      provenance: {\n        source: isWorldCover ? 'other' : 'osm',\n        sourceFeature: isWorldCover ? `ESA WorldCover 2021 ${kind.replace('landcover-', '')}` : `cached OSM ${kind} context`,\n        confidence: isWorldCover ? 'medium' : 'high',\n        note: isWorldCover\n          ? '10 m WorldCover context used only where explicit OSM golf/context geometry is absent; not promoted to a tactical surface.'\n          : 'Compiled from the cached OSM golf=hole route package.',\n      },\n    }]''',
          )

          replace_once(
              'src/pages/LiveCaddiePage.css',
              '''.live-context.context-native-ground {\n  fill: url(#liveNativePattern);\n  stroke: rgba(178, 164, 91, 0.25);\n  stroke-width: 0.08;\n  opacity: 0.68;\n}''',
              '''.live-context.context-landcover-grass {\n  fill: url(#liveNativePattern);\n  stroke: none;\n  opacity: 0.58;\n}\n\n.live-context.context-landcover-woods {\n  fill: url(#liveWoodsPattern);\n  stroke: rgba(131, 173, 115, 0.28);\n  stroke-width: 0.08;\n  opacity: 0.78;\n}\n\n.live-context.context-landcover-scrub {\n  fill: url(#liveScrubPattern);\n  stroke: rgba(176, 165, 98, 0.24);\n  stroke-width: 0.08;\n  opacity: 0.74;\n}\n\n.live-context.context-landcover-bare {\n  fill: url(#liveDunePattern);\n  stroke: rgba(224, 197, 137, 0.3);\n  stroke-width: 0.08;\n  opacity: 0.78;\n}''',
          )
          PY

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geometry and landcover dependencies
        run: pip install -r requirements-course-geometry.txt rasterio==1.4.3 pyproj==3.7.2

      - name: Preserve current Arcadia terrain
        run: |
          mkdir -p /tmp/arcadia-worldcover
          cp public/course-geometry/arcadia-bluffs/course-v1.json /tmp/arcadia-worldcover/old-package.json

      - name: Rebuild Arcadia OSM base
        run: |
          python tools/build_osm_course_package_canonical.py \
            --osm artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json \
            --config config/course-geometry/arcadia-bluffs-v1.json \
            --output /tmp/arcadia-worldcover/osm-base.json \
            --manifest artifacts/course-geometry/arcadia-bluffs/validation-v1.json
          python tools/carry_forward_embedded_terrain.py \
            --old-package /tmp/arcadia-worldcover/old-package.json \
            --new-package /tmp/arcadia-worldcover/osm-base.json \
            --output /tmp/arcadia-worldcover/osm-terrain.json

      - name: Fill unmapped view context from WorldCover
        run: |
          python tools/enrich_worldcover_context.py \
            --package /tmp/arcadia-worldcover/osm-terrain.json \
            --output public/course-geometry/arcadia-bluffs/course-v1.json \
            --audit artifacts/course-geometry/arcadia-bluffs/worldcover-context-audit-v1.json \
            --source-url https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N42W087_Map.tif
          python tools/update_course_cache_after_rebuild.py \
            --cache artifacts/course-geometry/arcadia-bluffs/cache-v1.json \
            --config config/course-geometry/arcadia-bluffs-v1.json \
            --snapshot artifacts/course-geometry/arcadia-bluffs/osm-snapshot.json \
            --package public/course-geometry/arcadia-bluffs/course-v1.json \
            --manifest artifacts/course-geometry/arcadia-bluffs/validation-v1.json

      - name: Validate Holes 2 and 9 context
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path('public/course-geometry/arcadia-bluffs/course-v1.json').read_text())
          audit = json.loads(Path('artifacts/course-geometry/arcadia-bluffs/worldcover-context-audit-v1.json').read_text())
          for hole_number in ('2', '9'):
              hole = package['holes'][hole_number]
              context = hole.get('context') or {}
              if 'native-ground' in context:
                  raise SystemExit(f'Hole {hole_number}: legacy native-ground is still present')
              grass = context.get('landcover-grass') or []
              if not grass:
                  raise SystemExit(f'Hole {hole_number}: WorldCover grass context missing')
              stats = audit['holes'][hole_number]['classes']
              print(hole_number, {k: v['polygons'] for k, v in stats.items()})
          PY

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate runtime
        run: |
          npm ci
          npm run build
          npm run courses:audit-runtime -- --strict --candidate arcadia-bluffs

      - name: Commit Arcadia WorldCover enrichment
        run: |
          git add \
            tools/enrich_worldcover_context.py \
            tools/build_osm_course_package_v4.py \
            config/course-geometry/arcadia-bluffs-v1.json \
            src/courseGeometry/types.ts \
            src/courseGeometry/routePackagedCourseLoader.ts \
            src/pages/LiveCaddiePage.css \
            artifacts/course-geometry/arcadia-bluffs/validation-v1.json \
            artifacts/course-geometry/arcadia-bluffs/cache-v1.json \
            artifacts/course-geometry/arcadia-bluffs/worldcover-context-audit-v1.json \
            public/course-geometry/arcadia-bluffs/course-v1.json \
            src/courseGeometry/generatedRouteHoleHeadings.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(course): fill Arcadia unmapped context from WorldCover'
          git push origin HEAD:web-course-importer-surface-semantics-v2
