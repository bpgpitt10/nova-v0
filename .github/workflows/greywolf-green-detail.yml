name: Greywolf green detail package

on:
  push:
    branches:
      - exact-pin-outputlog-v1
    paths:
      - tools/build_greywolf_green_detail.py
      - .github/workflows/greywolf-green-detail.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-green-detail:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exact-pin-outputlog-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install terrain compiler dependencies
        run: pip install --quiet numpy rasterio pyproj scikit-image

      - name: Download official 1 m LidarBC DEM
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/greywolf_dem.tif \
            https://nrs.objectstore.gov.bc.ca/gdwuts/082/082k/2015/dem/bc_082k049_xli1m_utm11_2015.tif
          test -s /tmp/greywolf_dem.tif

      - name: Compile high-resolution green detail package
        run: |
          python tools/build_greywolf_green_detail.py \
            --dem /tmp/greywolf_dem.tif \
            --geometry-dir public/course-geometry/greywolf/local-geometry \
            --output public/course-geometry/greywolf/green-detail-v1.json
          test -s public/course-geometry/greywolf/green-detail-v1.json

      - name: Persist generated green detail package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/course-geometry/greywolf/green-detail-v1.json
          if git diff --cached --quiet; then
            echo "Green detail package unchanged"
          else
            git commit -m "Build Greywolf high-resolution green detail package"
            git fetch origin exact-pin-outputlog-v1
            git rebase origin/exact-pin-outputlog-v1
            git push origin HEAD:exact-pin-outputlog-v1
          fi
