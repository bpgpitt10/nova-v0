name: Diagnose Course OSM Geometry (Read Only)

on:
  push:
    branches:
      - web-course-e2e-preflight-v1
    paths:
      - tools/diagnose_course_osm_readonly.py
      - .github/workflows/diagnose-course-osm-readonly.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect nearby OSM features, read-only
        run: python tools/diagnose_course_osm_readonly.py
