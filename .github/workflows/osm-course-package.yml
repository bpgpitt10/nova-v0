name: Generic OSM course packages

on:
  push:
    branches:
      - course-geometry-tactical-v0
      - course-importer-cache-v1
      - course-component-selection-v1
    paths:
      - config/course-geometry/**
      - tools/import_osm_course.py
      - tools/timed_import_osm_course.py
      - tools/fetch_osm_course_snapshot.py
      - tools/audit_osm_topology.py
      - tools/build_osm_course_package.py
      - tools/build_osm_course_package_v2.py
      - tools/build_osm_course_package_v3.py
      - tools/requirements-course-importer.txt
      - .github/workflows/osm-course-package.yml
  workflow_dispatch:
    inputs:
      config_path:
        description: Optional single course config path; blank imports every configured course
        required: false
        default: ''
        type: string
      refresh_osm:
        description: Force a fresh OSM snapshot instead of using the cached snapshot
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: osm-course-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-course-packages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install course importer dependencies
        run: pip install -r tools/requirements-course-importer.txt

      - name: Import, audit, and time course package(s)
        shell: bash
        env:
          INPUT_CONFIG_PATH: ${{ inputs.config_path }}
          INPUT_REFRESH_OSM: ${{ inputs.refresh_osm }}
        run: |
          set -uo pipefail

          configs=()
          if [[ -n "${INPUT_CONFIG_PATH:-}" ]]; then
            configs+=("$INPUT_CONFIG_PATH")
          else
            while IFS= read -r config; do
              configs+=("$config")
            done < <(find config/course-geometry -maxdepth 1 -type f -name '*-v1.json' | sort)
          fi

          if [[ "${#configs[@]}" -eq 0 ]]; then
            echo "No course build configs found" >&2
            exit 1
          fi

          failures=()
          for config in "${configs[@]}"; do
            if [[ ! -f "$config" ]]; then
              failures+=("$config:missing")
              continue
            fi
            echo "Timed import: $config"
            args=(--config "$config")
            if [[ "${INPUT_REFRESH_OSM:-false}" == "true" ]]; then
              args+=(--refresh-osm)
            fi
            python tools/timed_import_osm_course.py "${args[@]}"
            status=$?
            if [[ "$status" -ne 0 ]]; then
              failures+=("$config:$status")
            fi
          done

          if [[ "${#failures[@]}" -gt 0 ]]; then
            printf 'Course import failures:\n' >&2
            printf '  %s\n' "${failures[@]}" >&2
            exit 1
          fi

      - name: Persist timing history even when an import fails
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/course-geometry/*/import-timings.ndjson 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new course timing rows"
            exit 0
          fi
          git commit -m "Record OSM course import timings"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify generated package inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          configs = sorted(Path('config/course-geometry').glob('*-v1.json'))
          failures = []
          rows = []
          for path in configs:
              config = json.loads(path.read_text())
              slug = config.get('slug') or path.stem.rsplit('-v1', 1)[0]
              root = Path('artifacts/course-geometry') / slug
              package = Path('public/course-geometry') / slug / 'course-v1.json'
              manifest = root / 'validation-v1.json'
              snapshot = root / 'osm-snapshot.json'
              topology = root / 'topology-audit-v1.json'
              cache = root / 'cache-v1.json'
              timings = root / 'import-timings.ndjson'
              ok = all(candidate.exists() for candidate in (package, manifest, snapshot, topology, cache, timings))
              cache_status = None
              used_network = None
              total_ms = None
              timing_runs = 0
              if ok:
                  proof = json.loads(manifest.read_text())
                  cache_proof = json.loads(cache.read_text())
                  timing_rows = [
                      json.loads(line)
                      for line in timings.read_text().splitlines()
                      if line.strip()
                  ]
                  timing_runs = len(timing_rows)
                  latest_timing = timing_rows[-1] if timing_rows else {}
                  cache_status = (cache_proof.get('freshness') or {}).get('status')
                  used_network = (cache_proof.get('lastBuild') or {}).get('usedNetworkForOsm')
                  total_ms = (latest_timing.get('timingMs') or {}).get('total')
                  ok = (
                      proof.get('osmHoleRoutes') == 18
                      and proof.get('readyHoleCount') == 18
                      and proof.get('allHolesStaticGeometryReady') is True
                      and proof.get('compiler') == 'build_osm_course_package_v3'
                      and cache_proof.get('schemaVersion') == 'looper-course-cache-v1'
                      and (cache_proof.get('refreshPolicy') or {}).get('serveCachedRegardlessOfAge') is True
                      and (cache_proof.get('refreshPolicy') or {}).get('deleteOnAge') is False
                      and latest_timing.get('success') is True
                      and isinstance(total_ms, (int, float))
                  )
              rows.append({
                  'course': config.get('courseId'),
                  'slug': slug,
                  'ready': ok,
                  'cacheStatus': cache_status,
                  'usedNetworkForOsm': used_network,
                  'timingRuns': timing_runs,
                  'latestTotalMs': total_ms,
              })
              if not ok:
                  failures.append(slug)
          print(json.dumps(rows, indent=2))
          if failures:
              raise SystemExit(f"Course package/cache/timing validation failed: {failures}")
          PY

      - name: Persist cached packages and source proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/course-geometry artifacts/course-geometry
          if git diff --cached --quiet; then
            echo "Course package cache unchanged"
            exit 0
          fi

          branch="${GITHUB_REF_NAME}"
          git commit -m "Build cached OSM course packages"
          git push origin "HEAD:$branch"

      - name: Upload validation proof and timing logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-course-package-proof-${{ github.run_id }}
          path: |
            artifacts/course-geometry/**/validation-v1.json
            artifacts/course-geometry/**/cache-v1.json
            artifacts/course-geometry/**/topology-audit-v1.json
            artifacts/course-geometry/**/import-timings.ndjson
            artifacts/course-geometry/**/overpass-query.txt
            public/course-geometry/**/course-v1.json
          if-no-files-found: ignore
          retention-days: 14
