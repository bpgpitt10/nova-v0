name: course-model-prototype

# Builds layered course models (tools/course_model/courses.json) from unfiltered public sources
# (full OSM, 3DEP DEM in UTM, LiDAR point cloud -> trees) and commits compact
# outputs back to this branch. Prototype only; nothing here feeds the runtime.
on:
  push:
    branches: [course-model-prototype-v1]
    paths:
      - 'tools/course_model/**'
      - '.github/workflows/course-model-prototype.yml'

permissions:
  contents: write

concurrency:
  group: course-model-prototype
  cancel-in-progress: false

jobs:
  courses:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OUT: artifacts/course-model
      TMP: .tmp/course-model
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pure pip wheels: laspy+lazrs reads the EPT LAZ tiles, no PDAL/conda.
      - name: Install Python dependencies
        run: |
          python -m pip install -q numpy scipy rasterio pyproj shapely scikit-image matplotlib affine 'laspy[lazrs]'
          python -c "import rasterio, pyproj, shapely, skimage, scipy, laspy; print('python deps ok', laspy.__version__)"

      - name: Build course models
        run: bash tools/course_model/run_courses.sh

      - name: Commit outputs back to the branch
        if: always()
        run: |
          mkdir -p "$OUT"
          if [ ! -f "$OUT/run-summary.json" ]; then
            printf '{"allOk": false, "note": "workflow failed before the stage runner; see check-run annotations", "runId": "%s"}\n' "$GITHUB_RUN_ID" > "$OUT/run-summary.json"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$OUT"
          if git diff --cached --quiet; then
            echo 'No output changes to commit.'
            exit 0
          fi
          git commit -m "data(course-model): course model outputs (run ${GITHUB_RUN_ID})"
          git push origin HEAD:course-model-prototype-v1
