name: Generic course LiDAR terrain

on:
  push:
    branches:
      - course-importer-cache-v1
    paths:
      - tools/import_course_terrain.py
      - tools/import_course_terrain_v2.py
      - tools/compose_course_package.py
      - config/course-geometry/augusta-national-v1.json
      - config/course-geometry/oakmont-country-club-v1.json
      - config/course-geometry/erin-hills-v1.json
      - .github/workflows/course-terrain-package.yml
  workflow_dispatch:

concurrency:
  group: generic-course-lidar-terrain
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-terrain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-importer-cache-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install terrain dependencies
        run: pip install --quiet numpy rasterio pyproj

      - name: Build Augusta National LiDAR terrain
        run: python tools/import_course_terrain_v2.py --config config/course-geometry/augusta-national-v1.json

      - name: Build Oakmont LiDAR terrain
        run: python tools/import_course_terrain_v2.py --config config/course-geometry/oakmont-country-club-v1.json

      - name: Build Erin Hills LiDAR terrain
        run: python tools/import_course_terrain_v2.py --config config/course-geometry/erin-hills-v1.json

      - name: Validate source terrain and composed runtime packages
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          courses = [
              ('augusta-national', 1.1),
              ('oakmont-country-club', 1.1),
              ('erin-hills', 1.1),
          ]

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for slug, max_resolution in courses:
              root = Path('artifacts/course-geometry') / slug
              public_path = Path('public/course-geometry') / slug / 'course-v1.json'
              validation = json.loads((root / 'terrain-validation-v1.json').read_text())
              terrain_cache = json.loads((root / 'terrain-cache-v1.json').read_text())
              source = json.loads((root / 'terrain-source-v1.json').read_text())
              course_cache = json.loads((root / 'cache-v1.json').read_text())
              package = json.loads(public_path.read_text())

              assert validation['allHolesTerrainReady'] is True, (slug, validation)
              assert validation['readyHoleCount'] == 18, (slug, validation['readyHoleCount'])
              assert len(validation['holes']) == 18, (slug, len(validation['holes']))
              assert validation['sourceResolutionMeters'] <= max_resolution + 0.05, (slug, validation['sourceResolutionMeters'])
              assert all(hole['routeNoDataFraction'] == 0 for hole in validation['holes']), (slug, 'route gaps')
              assert source['lidarDerived'] is True, (slug, source)
              assert source['products'], (slug, 'no source products')
              assert terrain_cache['allHolesTerrainReady'] is True, (slug, terrain_cache)
              assert terrain_cache['terrainPackageSha256'], (slug, terrain_cache)

              holes = package.get('holes') or {}
              assert len(holes) == 18, (slug, 'composed package hole count')
              for hole_number in range(1, 19):
                  terrain = (holes[str(hole_number)] or {}).get('terrain') or {}
                  assert terrain.get('source') == 'lidar-dem', (slug, hole_number, terrain)
                  assert terrain.get('sourceResolutionMeters', 999) <= max_resolution + 0.05, (slug, hole_number)
                  assert terrain.get('compression') == 'deflate', (slug, hole_number)
                  assert terrain.get('width', 0) > 0 and terrain.get('height', 0) > 0, (slug, hole_number)
                  assert terrain.get('valuesBase64'), (slug, hole_number, 'missing terrain payload')

              assert package.get('terrainProvenance'), (slug, 'missing terrain provenance')
              assert course_cache['package']['sha256'] == sha(public_path), (slug, 'composed package hash mismatch')
              assert course_cache['terrain']['status'] == 'cached', (slug, course_cache.get('terrain'))
              print(slug, validation['sourceResolutionMeters'], 'm', len(source['products']), 'source products; composed runtime PASS')
          PY

      - name: Prove cached rebuild avoids terrain source network
        run: |
          python tools/import_course_terrain_v2.py --config config/course-geometry/augusta-national-v1.json
          python tools/import_course_terrain_v2.py --config config/course-geometry/oakmont-country-club-v1.json
          python tools/import_course_terrain_v2.py --config config/course-geometry/erin-hills-v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          for slug in ('augusta-national', 'oakmont-country-club', 'erin-hills'):
              cache = json.loads((Path('artifacts/course-geometry') / slug / 'terrain-cache-v1.json').read_text())
              assert cache['allHolesTerrainReady'] is True, (slug, cache)
              assert cache['usedNetworkForTerrainSource'] is False, (slug, cache)
              print(slug, 'cached rebuild PASS; usedNetworkForTerrainSource=false')
          PY

      - name: Persist derived terrain cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for slug in augusta-national oakmont-country-club erin-hills; do
            git add "public/course-geometry/$slug/course-v1.json"
            git add "artifacts/course-geometry/$slug/cache-v1.json"
            git add "artifacts/course-geometry/$slug/terrain-v1.json"
            git add "artifacts/course-geometry/$slug/terrain-source-v1.json"
            git add "artifacts/course-geometry/$slug/terrain-cache-v1.json"
            git add "artifacts/course-geometry/$slug/terrain-validation-v1.json"
            git add "artifacts/course-geometry/$slug/terrain-compose-v1.json"
          done
          if git diff --cached --quiet; then
            echo "Terrain packages unchanged"
          else
            git commit -m "Build cached LiDAR terrain packages"
            git fetch origin course-importer-cache-v1
            git rebase origin/course-importer-cache-v1
            git push origin HEAD:course-importer-cache-v1
          fi
