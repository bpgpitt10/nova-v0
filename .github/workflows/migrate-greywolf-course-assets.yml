name: Migrate Greywolf geometry assets

on:
  push:
    branches:
      - course-geometry-tactical-v0
    paths:
      - .github/workflows/migrate-greywolf-course-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-geometry-tactical-v0

      - name: Copy proven Greywolf assets onto canonical branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/course-geometry/greywolf/local-geometry

          for hole in $(seq -w 1 18); do
            curl -L --fail --retry 3 \
              -o "public/course-geometry/greywolf/local-geometry/greywolf-hole-${hole}.json" \
              "https://raw.githubusercontent.com/bpgpitt10/nova-v0/hazard-field-lab-v0/artifacts/osm-proof/local-geometry/greywolf-hole-${hole}.json"
          done

          curl -L --fail --retry 3 \
            -o public/course-geometry/greywolf/environment-v1.json \
            https://raw.githubusercontent.com/bpgpitt10/nova-v0/course-geometry-package-v1/public/course-geometry/greywolf-v1.json

          cp public/course-geometry/greywolf-terrain-v1.json \
            public/course-geometry/greywolf/terrain-v1.json

          test "$(find public/course-geometry/greywolf/local-geometry -name 'greywolf-hole-*.json' | wc -l)" -eq 18
          test -s public/course-geometry/greywolf/environment-v1.json
          test -s public/course-geometry/greywolf/terrain-v1.json

      - name: Persist canonical Greywolf cache
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/course-geometry/greywolf
          if git diff --cached --quiet; then
            echo "Greywolf canonical assets already present"
          else
            git commit -m "Cache Greywolf geometry on canonical course branch"
            git fetch origin course-geometry-tactical-v0
            git rebase origin/course-geometry-tactical-v0
            git push origin HEAD:course-geometry-tactical-v0
          fi
